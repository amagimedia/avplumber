name: Deploy demo media to Pages

on:
  push:
    branches: [basketball-demo]
    paths:
      - .github/pages/download.html
      - .github/workflows/demo-media-pages.yml
      - demos/*/docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stage demo media
        shell: bash
        run: |
          set -euo pipefail
          install -D .github/pages/download.html _site/download.html
          while IFS= read -r -d '' file; do
            install -D "$file" "_site/$file"
          done < <(find demos -type f -path 'demos/*/docs/*' -print0)
          find _site -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
