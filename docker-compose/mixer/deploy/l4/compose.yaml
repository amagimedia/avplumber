name: avplumber-mixer-l4

services:
  mixer:
    image: &mixer-image ${MIXER_IMAGE_PREFIX:-avplumber-mixer-l4}-mixer:${MIXER_RELEASE}
    environment:
      CUDA_DEVICE_MAX_CONNECTIONS: ${CUDA_DEVICE_MAX_CONNECTIONS:-32}
      CUDA_DEVICE_MAX_COPY_CONNECTIONS: ${CUDA_DEVICE_MAX_COPY_CONNECTIONS:-8}
      # The operator page links to the graph viewer the proxy serves there.
      MIXER_GRAPH_URL: /graph/
    build:
      dockerfile: docker-compose/mixer/Dockerfile.fedora44
      args:
        FFMPEG_TAG: ${FFMPEG_TAG:?Use deploy/l4/stack.sh}
        AVPLUMBER_REVISION: ${AVPLUMBER_REVISION}
        BUILD_JOBS: ${BUILD_JOBS:-4}
    volumes:
      - ${MIXER_MEDIA_DIR}:/media:rw,z
    depends_on:
      seed:
        condition: service_completed_successfully
      graph:
        condition: service_started

  seed:
    image: *mixer-image
    entrypoint: [python3, docker-compose/mixer/deploy/l4/seed.py]
    command: [/initial-settings.json, /media]
    volumes:
      - ${MIXER_MEDIA_DIR}:/media:rw,z
      - ${MIXER_INITIAL_SETTINGS}:/initial-settings.json:ro,z

  janus:
    image: ${MIXER_IMAGE_PREFIX:-avplumber-mixer-l4}-janus:${MIXER_RELEASE}
    # Setup creates every program and AUX mountpoint with its selected codec.
    volumes:
      - ./deploy/l4/streaming.jcfg:/opt/janus-avp/etc/janus/janus.plugin.streaming.jcfg.template:ro,z

  janus-preview:
    image: ${MIXER_IMAGE_PREFIX:-avplumber-mixer-l4}-preview:${MIXER_RELEASE}
    environment:
      # Reached through the proxy's /preview/ only.
      JANUS_PREVIEW_BIND: 127.0.0.1

  dma-browser:
    image: ${MIXER_IMAGE_PREFIX:-avplumber-mixer-l4}-browser:${MIXER_RELEASE}
    # Chromium raises its GPU processes to nice -8, and under CPU contention the browser's GL
    # work then outranks the mixer's deadline threads on the same host. A lower CPU weight for
    # the whole browser container keeps the mixer first (measured 2026-10-15 on the L4 show).
    cpu_shares: 512
    # Ceiling only: the browser normally uses ~2.8 CPUs. A 1.5-CPU cap starves the 40 windows to
    # 14-16 fps (about 640 repeated browser frames a second on the compositor, measured 2026-10-15).
    cpus: "4"
    environment:
      DMA_BROWSER_WINDOWS_PER_PROCESS: ${DMA_BROWSER_WINDOWS_PER_PROCESS:-10}
      DMA_BROWSER_STAGGER_FRAMES: ${DMA_BROWSER_STAGGER_FRAMES:-1}
      # Frames a window may have out to the mixer; the L4 show runs 11 (9 is the least without
      # repeated frames, deps/dma-browser/README.md).
      DMA_BROWSER_DMABUF_POOL_SIZE: ${DMA_BROWSER_DMABUF_POOL_SIZE:-11}

  wayland:
    image: ${MIXER_IMAGE_PREFIX:-avplumber-mixer-l4}-wayland:${MIXER_RELEASE}

  graph:
    image: ${MIXER_IMAGE_PREFIX:-avplumber-mixer-l4}-graph:${MIXER_RELEASE}
    build:
      context: ../..
      dockerfile: docker-compose/images/web-ui/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      WEBUI_PORT: "22222"
      # Hostnames the browser reaches the proxy by; the viewer refuses other Host headers.
      WEBUI_ALLOWED_HOSTS: ${WEBUI_ALLOWED_HOSTS:-${JANUS_NAT_1_1:-${JANUS_HOST_IP:-}}}

  proxy:
    image: nginx:alpine
    network_mode: host
    restart: unless-stopped
    depends_on: [mixer, janus-preview]
    environment:
      MIXER_PUBLIC_PORT: ${MIXER_PUBLIC_PORT:-7681}
      MIXER_HTTP_PORT: ${MIXER_HTTP_PORT}
      MIXER_PREVIEW_PORT: ${JANUS_PREVIEW_PORT}
      NGINX_ENVSUBST_FILTER: ^MIXER_
    volumes:
      - ./deploy/l4/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,z
      # stack.sh refuses to start without it; /dev/null (no users) answers every request with 401.
      - ${MIXER_HTPASSWD:-/dev/null}:/etc/nginx/mixer.htpasswd:ro
