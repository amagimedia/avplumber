name: ${COMPOSE_PROJECT_NAME:-avplumber-compose}

x-gpu-env: &gpu-env
  NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
  CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
  NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute,video
  # Persist ffmpeg's CUDA PTX->SASS JIT cache (scale_cuda's ~5s first JIT) on the
  # cuda-jit-cache volume so it survives restarts; entrypoint pre-warms it once.
  CUDA_CACHE_PATH: ${CUDA_CACHE_PATH:-/cuda-cache}
  CUDA_CACHE_MAXSIZE: ${CUDA_CACHE_MAXSIZE:-1073741824}

x-gpu-deploy: &gpu-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  janus:
    build:
      context: ./images/janus
      dockerfile: Dockerfile
      args:
        JANUS_REF: ${JANUS_REF:-v1.4.1}
    image: ${JANUS_IMAGE:-avplumber-janus}:${JANUS_IMAGE_TAG:-v1.4.1}
    network_mode: host
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp:unconfined
    environment:
      JANUS_HOST_IP: ${JANUS_HOST_IP:-127.0.0.1}
      JANUS_HTTP_PORT: ${JANUS_HTTP_PORT:-8088}
      JANUS_WS_PORT: ${JANUS_WS_PORT:-8188}
      JANUS_AUDIO_ENABLED: ${JANUS_AUDIO_ENABLED:-true}
      JANUS_AUDIO_PORT: ${JANUS_AUDIO_PORT:-5002}
      JANUS_AUDIO_RTCP_PORT: ${JANUS_AUDIO_RTCP_PORT:-5003}
      JANUS_VIDEO_PORT: ${JANUS_VIDEO_PORT:-5004}
      JANUS_VIDEO_RTCP_PORT: ${JANUS_VIDEO_RTCP_PORT:-5005}
      JANUS_RTP_PORT_RANGE: ${JANUS_RTP_PORT_RANGE:-20000-20100}
      JANUS_DEBUG_LEVEL: ${JANUS_DEBUG_LEVEL:-4}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  janus-preview:
    build:
      context: ./images/preview
      dockerfile: Dockerfile
    image: ${JANUS_PREVIEW_IMAGE:-avplumber-janus-preview}:${JANUS_PREVIEW_IMAGE_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - janus
    environment:
      JANUS_HTTP_PORT: ${JANUS_HTTP_PORT:-8088}
      JANUS_WS_PORT: ${JANUS_WS_PORT:-8188}
      JANUS_PREVIEW_PORT: ${JANUS_PREVIEW_PORT:-8080}

  web-ui:
    build:
      context: ..
      dockerfile: docker-compose/images/web-ui/Dockerfile
    image: ${WEB_UI_IMAGE:-avplumber-web-ui}:${WEBUI_IMAGE_TAG:-latest}
    network_mode: host
    restart: unless-stopped
    environment:
      WEBUI_PORT: ${WEBUI_PORT:-22222}
      AVPLUMBER_HOST: 127.0.0.1
      AVPLUMBER_PORT: ${REMOTE_CONTROL_PORT:-22422}
      AVPLUMBER_LOGFILE: ${AVP_LOGFILE:-/var/log/avplumber/avplumber.log}
    volumes:
      - runner-logs:/var/log/avplumber:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.WEBUI_PORT||22222;fetch('http://127.0.0.1:'+p+'/api/instances').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 6

  wayland:
    build:
      context: ./images/wayland
      dockerfile: Dockerfile
    image: ${WAYLAND_IMAGE:-avplumber-wayland}:${WAYLAND_IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy: *gpu-deploy
    security_opt:
      - seccomp:unconfined
    devices:
      - ${DRI_DEVICE:-/dev/dri}:${DRI_DEVICE:-/dev/dri}
    privileged: true
    environment:
      <<: *gpu-env
      XDG_RUNTIME_DIR: /run/avp-wayland
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      WLR_BACKENDS: headless
      WLR_LIBINPUT_NO_DEVICES: "1"
      WLR_NO_HARDWARE_CURSORS: "1"
      WLR_RENDERER: ${WLR_RENDERER:-gles2}
      WLR_RENDER_DRM_DEVICE: ${WLR_RENDER_DRM_DEVICE:-/dev/dri/renderD128}
    volumes:
      - wayland-runtime:/run/avp-wayland
    healthcheck:
      test: ["CMD-SHELL", "socat -u OPEN:/dev/null UNIX-CONNECT:$${XDG_RUNTIME_DIR:-/run/avp-wayland}/$${WAYLAND_DISPLAY:-wayland-1}"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  dma-browser:
    build:
      context: ..
      dockerfile: docker-compose/images/dma-browser/Dockerfile
    image: ${DMA_BROWSER_IMAGE:-avplumber-dma-browser}:${DMA_BROWSER_IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy: *gpu-deploy
    shm_size: 1gb
    depends_on:
      wayland:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    devices:
      - ${DRI_DEVICE:-/dev/dri}:${DRI_DEVICE:-/dev/dri}
    privileged: false
    environment:
      <<: *gpu-env
      XDG_RUNTIME_DIR: /run/avp-wayland
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      DMA_BROWSER_FORCE_NVIDIA: "1"
      DMA_BROWSER_REST_HOST: 0.0.0.0
      DMA_BROWSER_REST_PORT: ${DMA_BROWSER_REST_PORT:-9009}
      DMA_BROWSER_SOCKET_DIR: /tmp/dma-page
      DMA_BROWSER_AUTO_OPEN_ID: overlay
      DMA_BROWSER_AUTO_OPEN_URL: ${HTML_OVERLAY_URL:-}
      DMA_BROWSER_AUTO_OPEN_WIDTH: ${HTML_OVERLAY_WIDTH:-1080}
      DMA_BROWSER_AUTO_OPEN_HEIGHT: ${HTML_OVERLAY_HEIGHT:-1920}
      DMA_BROWSER_AUTO_OPEN_FPS: ${HTML_OVERLAY_FPS:-30}
      DMA_BROWSER_AUTO_OPEN_AUDIO: "0"
      DMA_BROWSER_ALLOWED_DIMS: ${DMA_BROWSER_ALLOWED_DIMS:-1080x1920,1920x1080,1280x720}
      DMA_BROWSER_DMABUF_POOL_SIZE: ${DMA_BROWSER_DMABUF_POOL_SIZE:-11}
      DMA_BROWSER_RENDER_NODE: ${DMA_BROWSER_RENDER_NODE:-}
    volumes:
      - wayland-runtime:/run/avp-wayland
      - dma-browser-sockets:/tmp/dma-page
    ports:
      - "${DMA_BROWSER_REST_PORT:-9009}:9009"

  runner:
    profiles:
      - script
    image: ${AVP_RUNNER_IMAGE:?set AVP_RUNNER_IMAGE to an AVPlumber runtime image}
    network_mode: host
    restart: "no"
    deploy: *gpu-deploy
    devices:
      - ${DRI_DEVICE:-/dev/dri}:${DRI_DEVICE:-/dev/dri}
    depends_on:
      janus:
        condition: service_started
      web-ui:
        condition: service_healthy
      wayland:
        condition: service_healthy
      dma-browser:
        condition: service_healthy
    entrypoint: ["/opt/avp-compose-runner/run-avplumber-script.sh"]
    environment:
      <<: *gpu-env
      LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:-/usr/local/lib:/opt/tensorrt/lib:/usr/local/cuda-13.0/targets/x86_64-linux/lib}
      AVP_SCRIPT: /run/avp/script.avplumber
      AVP_SCRIPT_FILE: ${AVP_SCRIPT_FILE:-}
      AVP_WEBUI_API: http://127.0.0.1:${WEBUI_PORT:-22222}
      AVP_REMOTE_CONTROL_PORT: ${REMOTE_CONTROL_PORT:-22422}
      AVP_INSTANCE_NAME: ${AVP_INSTANCE_NAME:-script-runner}
      AVP_LOGFILE: ${AVP_LOGFILE:-/var/log/avplumber/script-runner.log}
      AVP_EXTRA_ARGS: ${AVP_EXTRA_ARGS:-}
      XDG_RUNTIME_DIR: /run/avp-wayland
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
    volumes:
      - ./scripts/run-avplumber-script.sh:/opt/avp-compose-runner/run-avplumber-script.sh:ro
      - ${AVP_SCRIPT_FILE:-./empty/script.avplumber}:/run/avp/script.avplumber:ro
      - ${AVP_MEDIA_DIR:-./empty/media}:/media:ro
      - ${AVP_MODELS_DIR:-./empty/models}:/models:ro
      - ${AVP_ARTIFACT_DIR:-./artifacts}:/artifacts
      - runner-logs:/var/log/avplumber
      - cuda-jit-cache:/cuda-cache
      - wayland-runtime:/run/avp-wayland
      - dma-browser-sockets:/tmp/dma-page

volumes:
  dma-browser-sockets:
  runner-logs:
  cuda-jit-cache:
  wayland-runtime:
