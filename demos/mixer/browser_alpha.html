<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mixer alpha test</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { color: white; font: 2.5vw system-ui, sans-serif; }
  header { position: absolute; top: 5%; left: 5%; padding: .4em .7em; background: #172536cc; }
  #patches { position: absolute; left: 5%; top: 30%; width: 90%; height: 40%; display: flex; gap: 2%; }
  .column { flex: 1; position: relative; }
  .swatch { height: 80%; background: linear-gradient(to bottom, white 0% 25%, red 25% 50%, lime 50% 75%, blue 75%); }
  .label { position: absolute; top: 85%; width: 100%; text-align: center; text-shadow: 0 1px 3px black; }
  /* A motion test that never rests: the marker moves exactly 25 px per frame period of the page's
     own frame clock, so in the output every frame must differ from the last by one step; a held
     picture or a skipped paint is a 0 or 50 px step. Opaque, high contrast and on top, so it can be
     measured over any video. The counter is the page's frame index, for reading frames by OCR. */
  #marker { position: absolute; left: 5%; bottom: 8%; width: 96px; height: 96px; background: #ff00ff;
            border: 6px solid black; box-sizing: border-box; z-index: 10; will-change: transform; }
  #counter { position: absolute; right: 5%; top: 5%; padding: .1em .3em; background: black; color: #ffff00;
             font: bold 6vw ui-monospace, monospace; z-index: 10; }
</style>
<header>Browser alpha over video</header>
<div id="patches"></div>
<div id="marker"></div>
<script>
  // prepare_demo embeds the browser source's id as data-source; name the window by it.
  const source = document.documentElement.dataset.source;
  if (source) document.querySelector('header').textContent = `${source} · alpha over video`;
  for (const alpha of [0, 0.25, 0.5, 0.75, 1]) {
    const column = document.createElement('div');
    column.className = 'column';
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.opacity = alpha;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `${alpha * 100}%`;
    column.append(swatch, label);
    document.querySelector('#patches').append(column);
  }
  // Each animation frame advances the index by the frame periods elapsed since the last one (1, or
  // more after a skipped begin-frame) and puts the marker at 25 px per index, out 60 steps and back.
  const STEP_PX = 25, STEPS = 60, PERIOD_MS = 1000 / 30;
  const marker = document.getElementById('marker');
  const counter = document.createElement('div');
  counter.id = 'counter';
  document.body.append(counter);
  const offset = Number(source?.match(/\d+$/)?.[0] ?? 0) * 7;   // windows out of step with each other
  let frame = 0, last = null;
  const tick = (now) => {
    frame += last === null ? 0 : Math.max(1, Math.round((now - last) / PERIOD_MS));
    last = now;
    const phase = (frame + offset) % (2 * STEPS);
    marker.style.transform = `translateX(${(phase < STEPS ? phase : 2 * STEPS - phase) * STEP_PX}px)`;
    counter.textContent = String(frame).padStart(6, '0');
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
</script>
</html>
