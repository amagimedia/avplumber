<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mixer alpha test</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { color: white; font: 2.5vw system-ui, sans-serif; }
  header { position: absolute; top: 5%; left: 5%; padding: .4em .7em; background: #172536cc; }
  #patches { position: absolute; left: 5%; top: 30%; width: 90%; height: 40%; display: flex; gap: 2%; }
  .column { flex: 1; position: relative; }
  .swatch { height: 80%; background: linear-gradient(to bottom, white 0% 25%, red 25% 50%, lime 50% 75%, blue 75%); }
  .label { position: absolute; top: 85%; width: 100%; text-align: center; text-shadow: 0 1px 3px black; }
  /* Like a real graphic, the marker rests 4 s and slides 2 s (a third of the time): Chromium paints
     only on change, so a resting page costs next to no CPU. Slide with transform, not left, which
     snaps to whole pixels and lays out on the main thread each frame (judder); 82vw is 5%..87%. */
  #marker { position: absolute; left: 5%; bottom: 8%; width: 8%; height: 6%; background: #ffffff80;
            will-change: transform; transition: transform 2s linear; }
  #marker.right { transform: translateX(82vw); }
</style>
<header>Browser alpha over video</header>
<div id="patches"></div>
<div id="marker"></div>
<script>
  // prepare_demo embeds the browser source's id as data-source; name the window by it.
  const source = document.documentElement.dataset.source;
  if (source) document.querySelector('header').textContent = `${source} · alpha over video`;
  for (const alpha of [0, 0.25, 0.5, 0.75, 1]) {
    const column = document.createElement('div');
    column.className = 'column';
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.opacity = alpha;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `${alpha * 100}%`;
    column.append(swatch, label);
    document.querySelector('#patches').append(column);
  }
  // Slide every 6 s from a point of the cycle set by the id's number (browser_007 is 7): golden
  // ratio steps spread any count of windows evenly, so they do not all slide, and paint, at once.
  const CYCLE_MS = 6000;
  const marker = document.getElementById('marker');
  const index = Number(source?.match(/\d+$/)?.[0] ?? 0);
  setTimeout(() => {
    const slide = () => marker.classList.toggle('right');
    slide();
    setInterval(slide, CYCLE_MS);
  }, (index * 0.6180339887 % 1) * CYCLE_MS);
</script>
</html>
