<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mixer alpha test</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { color: white; font: 2.5vw system-ui, sans-serif; }
  header { position: absolute; top: 5%; left: 5%; padding: .4em .7em; background: #172536cc; }
  #patches { position: absolute; left: 5%; top: 30%; width: 90%; height: 40%; display: flex; gap: 2%; }
  .column { flex: 1; position: relative; }
  .swatch { height: 80%; background: linear-gradient(to bottom, white 0% 25%, red 25% 50%, lime 50% 75%, blue 75%); }
  .label { position: absolute; top: 85%; width: 100%; text-align: center; text-shadow: 0 1px 3px black; }
  /* A motion test that never rests: the marker steps exactly 25 px per frame (60 steps of 1/30 s,
     out and back), so in the output every frame must differ from the last by one step; a held
     picture or a skipped paint is a 0 or 50 px step. A transform animation runs on Chromium's
     compositor alone: no script and no repaint per frame, so 40 moving windows stay cheap.
     Opaque, high contrast and on top, so it can be measured over any video. */
  #marker { position: absolute; left: 5%; bottom: 8%; width: 96px; height: 96px; background: #ff00ff;
            border: 6px solid black; box-sizing: border-box; z-index: 10; will-change: transform;
            animation: avp-step 2s steps(60, end) infinite alternate; }
  @keyframes avp-step { from { transform: translateX(0); } to { transform: translateX(1500px); } }
</style>
<header>Browser alpha over video</header>
<div id="patches"></div>
<div id="marker"></div>
<script>
  // prepare_demo embeds the browser source's id as data-source; name the window by it.
  const source = document.documentElement.dataset.source;
  if (source) document.querySelector('header').textContent = `${source} · alpha over video`;
  for (const alpha of [0, 0.25, 0.5, 0.75, 1]) {
    const column = document.createElement('div');
    column.className = 'column';
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.opacity = alpha;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `${alpha * 100}%`;
    column.append(swatch, label);
    document.querySelector('#patches').append(column);
  }
  // Windows out of step with each other: each starts at its own point of the 4 s cycle.
  const index = Number(source?.match(/\d+$/)?.[0] ?? 0);
  document.getElementById('marker').style.animationDelay = `-${((index * 0.6180339887) % 1) * 4}s`;
</script>
</html>
