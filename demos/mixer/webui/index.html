<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVPlumber mixer</title>
<style>
  /* The mixer UI is deliberately dark-only. */
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --panel: #14181d; --raised: #1b2129; --edge: #232b34;
    --text: #e8edf2; --muted: #8b98a5; --faint: #5d6874;
    --pgm: #e5484d; --pgm-dim: #3a1416; --pvw: #30a46c; --pvw-dim: #0f2a1d;
    --accent: #f5a524; --wipe: #6e8bf5; --warn: #f5a524; --ok: #30a46c;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; padding-block: 12px;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Segmented controls and slots clip their children, so their rings go inside. */
  .seg button:focus-visible, .slot button:focus-visible { outline-offset: -2px; }

  /* ---------- top bar ---------- */
  #top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #top h1 { font-size: 15px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; margin: 0; }
  .link { color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--accent); }
  #counts { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #counts b { color: var(--text); font-weight: 600; }
  #conn { margin-left: auto; color: var(--pgm); font-size: 12px; }
  #stats { flex: 0 1 auto; min-width: 0; display: flex; justify-content: flex-end; margin-left: auto; gap: 12px; }
  #stats, .vstats { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #conn:not([hidden]) + #stats { margin-left: 0; }
  .group { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  #gpu { border-left: 1px solid var(--edge); padding-left: 12px; }   /* apart from the pipeline's latency */
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter i { position: relative; width: 38px; height: 5px; border-radius: 3px; background: var(--edge); overflow: hidden; }
  .meter i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v); background: var(--c, var(--ok)); border-radius: 3px; }
  .meter b { color: var(--text); font-weight: 600; min-width: 3.2ch; text-align: right; }
  .meter b[data-level="good"] { color: var(--ok); }
  .meter b[data-level="warn"] { color: var(--warn); }
  .meter b[data-level="bad"] { color: var(--pgm); }
  .meter b.ms { min-width: 6ch; }
  #lat b { text-align: left; }   /* "—", "186 ms" and "1.2 s" take the same room, so new numbers never move the row */
  .meter .u { margin-left: .25em; }

  /* ---------- shared controls ---------- */
  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--edge); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
  .seg button:disabled { color: var(--faint); cursor: not-allowed; }
  .viewers-ctl { display: inline-flex; align-items: center; gap: 14px; white-space: nowrap; }
  .seg-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .btn { border: 1px solid var(--edge); border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--raised); }
  .mini { width: 26px; height: 26px; padding: 0; border: 1px solid var(--edge); border-radius: 6px; background: var(--panel);
          cursor: pointer; line-height: 1; font-size: 14px; display: inline-grid; place-items: center; }
  .btn:hover, .mini:hover, .dd-btn:hover, .tile:hover { border-color: var(--muted); }
  .btn[aria-pressed="true"], .mini[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .mini svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* Names that share a prefix and differ in their tail, like grid_32_078, lose their start instead. */
  .tail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; min-width: 0; }
  .title { margin: 0; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  /* Styled dropdown: a button and a listbox, no native select */
  .dd { position: relative; min-width: 0; }
  .dd-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--edge); border-radius: 7px;
            background: var(--raised); padding: 4px 8px 4px 10px; cursor: pointer; font-size: 13px; font-weight: 600; max-width: 100%; }
  .dd-btn span { overflow: hidden; text-overflow: ellipsis; }
  .dd-btn svg { flex: none; width: 10px; height: 10px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .12s; }
  .dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd-menu { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 230px; margin: 0; padding: 6px;
             list-style: none; background: var(--panel); border: 1px solid var(--edge); border-radius: 9px;
             box-shadow: 0 12px 32px rgb(0 0 0 / .5); }
  .dd-menu .grp { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); padding: 6px 8px 3px; }
  .dd-menu [role="option"] { display: grid; grid-template-columns: 12px 1fr; column-gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .dd-menu [role="option"]:hover, .dd-menu [role="option"]:focus { background: var(--raised); outline: none; }
  .dd-menu [role="option"]::before { content: ""; grid-row: span 2; align-self: center; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--faint)); }
  .dd-menu [aria-selected="true"] { color: var(--accent); }
  .dd-menu .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dd.up .dd-menu { top: auto; bottom: calc(100% + 6px); }   /* the take bar sits at the bottom of the window */
  /* A fade: its seconds field joined to a curve menu that shows the curve's shape. */
  .fade-ctl { display: inline-flex; }
  .fade-ctl .field { border-right: 0; border-radius: 7px 0 0 7px; }
  .fade-ctl .field span { padding-right: 8px; }
  /* Arrow keys still step; the hover spinner would cover the value in these narrow fields. */
  .fade-ctl input { appearance: textfield; }
  .fade-ctl input::-webkit-inner-spin-button { display: none; }
  .fade-ctl .dd { display: flex; }
  .fade-ctl .dd-btn { border-radius: 0 7px 7px 0; padding: 0 5px; }
  .fade-ctl .dd-btn > :not(.glyph) { display: none; }
  .dd-btn svg.glyph { width: 14px; height: 10px; stroke: var(--text); stroke-width: 1.6; stroke-linecap: round; transform: none; }
  .fade-ctl .dd-menu { min-width: 150px; }

  /* ---------- workspace ---------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(480px, 1fr) auto; gap: 14px; }
  .card { border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }

  #deck { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; container-type: inline-size; }
  #deck > :not(#scenes-card) { flex-shrink: 0; }
  #buses { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bus { padding: 12px 16px; }
  .bus .scene { font-size: clamp(18px, 2.2vw, 26px); font-weight: 600; word-break: break-word; font-family: var(--mono); letter-spacing: -.01em; }
  .bus .state { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bus.pgm { border-color: var(--pgm); background: linear-gradient(var(--pgm-dim), var(--panel) 70%); }
  .bus.pgm .title { color: var(--pgm); }
  .bus.pvw { border-color: var(--pvw); background: linear-gradient(var(--pvw-dim), var(--panel) 70%); }
  .bus.pvw .title { color: var(--pvw); }

  #row2 { display: grid; grid-template-columns: minmax(min-content, 1fr) minmax(0, 2fr); gap: 12px; }
  #row2.single { grid-template-columns: minmax(0, 1fr); }
  .widget { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .widget header { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
  .widget header .note { font-size: 11px; color: var(--faint); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .widget header .note.warn { color: var(--warn); }
  /* The longer "Program preview slots" title keeps its note on the same line down to a 1366 px window. */
  #slots-card header { column-gap: 7px; }
  /* The key fade stays on the title line, compact and pulled into its height so the card does not grow;
     the note gives way to it (see trimTakebar). */
  #keys-card header { flex-wrap: nowrap; }
  #keys-card .note { flex: 1 1 0; width: 0; }   /* never widens the card; each key's tooltip says it too */
  .key-fade { margin-left: auto; align-self: center; flex: none; margin-block: -5px; }
  .key-fade .field { border-radius: 7px 0 0 7px; }
  .key-fade .field input { width: 2.8em; padding: 3px 2px 3px 7px; font-size: 12px; }
  .key-fade .field span { padding-right: 6px; font-size: 11px; }
  .key-fade .dd-btn { border-radius: 0 7px 7px 0; }
  .key-fade .dd-btn svg.glyph { width: 12px; height: 9px; }
  .key-fade .dd-menu { left: auto; right: 0; }
  #keys { display: grid; grid-template-columns: repeat(2, minmax(min-content, 1fr)); gap: 6px; }
  #row2.single #keys { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
  .key { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid var(--edge); border-radius: 7px;
         background: var(--raised); cursor: pointer; font-size: 13px; text-align: left; }
  .key::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .key[aria-pressed="true"] { border-color: var(--pgm); }
  .key[aria-pressed="true"]::before { background: var(--pgm); box-shadow: 0 0 6px var(--pgm); }
  #slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .slot { display: flex; min-width: 0; border: 1px solid var(--edge); border-radius: 7px; background: var(--raised); overflow: hidden; }
  .slot:has(.assign[aria-pressed="true"]) { border-color: var(--accent); }
  .slot button { border: 0; background: none; cursor: pointer; font-size: 12px; padding: 6px 7px; }
  .slot .assign { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 4px 6px; }
  .slot .assign b { color: var(--muted); font-weight: 600; font-size: 10.5px; letter-spacing: .08em; }
  .slot .assign span { font: 11.5px var(--mono); }
  .slot .assign.empty { color: var(--faint); }
  .slot .assign.empty .tail { direction: ltr; }   /* the "empty" placeholder keeps its start, like the mockup */
  .slot .clear { color: var(--muted); border-left: 1px solid var(--edge); padding-inline: 5px; }
  .slot .clear:hover { color: var(--text); }

  #scenes-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #scenes-card > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
  .newtab { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge); border-radius: 7px;
            background: var(--raised); padding: 4px 10px; font-size: 12px; font-weight: 600; color: inherit; text-decoration: none; }
  .newtab:hover { border-color: var(--accent); color: var(--accent); }
  .newtab svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--edge); border-radius: 999px; background: none; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .chip span { color: var(--faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--muted); color: var(--text); background: var(--raised); }

  /* A phone-wide deck keeps the scene list's height: the filter chips stay on one row that scrolls sideways.
     Two slot columns keep slot names whole. */
  @container (max-width: 440px) {
    #chips { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px;
             mask-image: linear-gradient(to right, #000 calc(100% - 14px), transparent); }
    #chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; padding-inline: 8px; }
    #slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  #scenes { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: grid; gap: 8px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-content: start; }
  .tile { display: flex; align-items: baseline; gap: 8px; text-align: left; cursor: pointer; background: var(--raised);
          border: 1px solid var(--edge); border-radius: 8px; padding: 9px 11px; min-height: 42px; font-family: var(--mono); font-size: 12.5px; }
  .tile .n { color: var(--muted); font-size: 11px; min-width: 1.1em; font-variant-numeric: tabular-nums; font-family: inherit; }
  .tile .label { overflow-wrap: anywhere; }
  .tile.pgm { border-color: var(--pgm); background: var(--pgm-dim); }
  .tile.pvw { border-color: var(--pvw); background: var(--pvw-dim); }
  #scenes.armed .tile:hover { border-color: var(--accent); }
  #graph { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #graph svg { flex: 1; min-height: 0; width: 100%; min-width: 480px; }
  #graph .node rect { fill: var(--raised); stroke: var(--edge); }
  #graph .node.hot rect { stroke: var(--accent); }
  #graph .node text { fill: var(--text); font: 600 12px ui-sans-serif, system-ui, sans-serif; }
  #graph .node text.sub { fill: var(--muted); font: 11px var(--mono); }
  #graph .node { cursor: pointer; }
  #graph .node:hover rect, #graph .node:focus-visible rect { stroke: var(--text); }
  #graph .node:focus-visible { outline: none; }
  #graph .node circle { fill: var(--ok); }
  #graph .node.warn circle { fill: var(--warn); }
  #graph .node.stale circle { fill: var(--faint); }   /* no fresh state: health unknown */
  #graph .edge { stroke: var(--faint); stroke-width: 1.5; fill: none; }
  #graph .edge.sub { stroke-dasharray: 4 4; }

  #takebar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 12px; }
  #cut { border-color: var(--pgm); } #fade { border-color: var(--pvw); }
  .wipe { border-color: var(--wipe); }
  #wipes { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .field { display: inline-flex; align-items: center; border: 1px solid var(--edge); border-radius: 7px; background: var(--raised); overflow: hidden; }
  .field input { width: 4.4em; border: 0; background: none; color: var(--text); font: inherit; font-size: 13px; padding: 4px 4px 4px 10px; font-variant-numeric: tabular-nums; }
  .field input:focus { outline: none; }
  .field:focus-within { border-color: var(--accent); }
  .field span { color: var(--muted); padding-right: 10px; font-size: 12px; }
  #wipe-file { width: 16em; padding-right: 10px; }
  #fade-s { width: 3em; }
  .vsep { width: 1px; align-self: stretch; background: var(--edge); margin-inline: 2px; }
  /* Right-aligned in the space the controls' last row leaves, never on a row of its own: keys only when
     the words do not fit, hidden when the keys do not either (see trimTakebar). */
  #hint { flex: 1 1 0; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; color: var(--faint); font-size: 11.5px; }
  #hint.short .w { display: none; }
  #hint kbd { font: 11px var(--mono); color: var(--muted); }
  #error { flex-basis: 100%; color: var(--pgm); font-size: 12.5px; }
  #error:empty { display: none; }

  /* ---------- monitor wall ---------- */
  #wall { display: flex; gap: 12px; min-height: 0; align-items: flex-start; }
  .viewer { position: relative; display: flex; flex-direction: column; min-width: 0; container-type: inline-size; --vstats-h: 27px; }
  .viewer > header { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; white-space: nowrap; padding: 8px 10px; border-bottom: 1px solid var(--edge); min-height: 45px; }
  .viewer .lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .viewer .lbl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tally, var(--faint)); }
  .viewer .close { margin-left: auto; flex: none; }
  /* A narrow paged viewer packs its header; if the label still does not fit, only the tally dot stays
     (.tight, set by fitHeader) so the pager and × stay on the card. */
  @container (max-width: 380px) {
    .viewer.paged > header { gap: 5px; padding-inline: 6px; }
    .viewer.paged .lbl { letter-spacing: .1em; }
    .viewer.paged .pager { gap: 2px; }
    .viewer.paged .pager .pg { min-width: 2.3em; }
  }
  .viewer > header.tight .lbl { font-size: 0; letter-spacing: 0; gap: 0; }
  .pager { display: inline-flex; align-items: center; gap: 4px; }
  .pager .pg { position: relative; min-width: 3.1em; text-align: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .pager .pg i { position: absolute; left: 0; bottom: -4px; height: 2px; width: 0; background: var(--accent); border-radius: 1px; }
  .screen { position: relative; aspect-ratio: 9 / 16; width: 100%; background: #050607; overflow: hidden; user-select: none; }
  /* A transparent layer over the player: its <video controls> would pause on a click and take the
     keyboard focus into its cross-origin frame, which ends the shortcuts. */
  .screen::after { content: ""; position: absolute; inset: 0; }
  /* The player page puts its <video> (object-fit: contain) above a stats footer whose height depends on
     how often it wraps. The frame is wide enough to keep that footer on one line even with six GPUs in
     its stats: 49 px tall, 60 px with the codec picker. The frame is that much taller than the screen,
     centred and clipped, so the picture is limited by height and fills the screen exactly, which the
     overlays rely on. */
  .screen iframe { position: absolute; top: 0; left: 50%; width: max(100%, 4096px); height: calc(100% + var(--chrome, 49px));
                   transform: translateX(-50%); border: 0; background: #050607; }
  .ovl { position: absolute; inset: 0; }
  /* This viewer's stream stats, one line under its screen; layoutWall leaves room for the row. */
  .vstats { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: var(--vstats-h); box-sizing: border-box;
            padding-inline: 10px; border-top: 1px solid var(--edge); white-space: nowrap; overflow: hidden; }
  .vstats b { text-align: left; }   /* the spare room falls after the value, into the gap */
  /* At the minimum viewer width the row packs, the unit spacing last. */
  @container (max-width: 300px) {
    .vstats { gap: 6px; padding-inline: 6px; }
    .vstats .meter { gap: 4px; }
    .vstats b.ms { min-width: 5ch; }
    .vstats .u { margin-left: 0; }
  }
  /* Over the screen's corner, outside it, so the header keeps its width for the output name. */
  .viewer .open { position: absolute; right: 8px; bottom: calc(var(--vstats-h) + 8px); z-index: 1; color: var(--text); background: rgb(0 0 0 / .62);
                  border-color: transparent; opacity: 0; transition: opacity .12s; }
  .viewer:hover .open, .viewer .open:focus-visible { opacity: 1; }
  .viewer .open:hover { border-color: var(--muted); }
  .screen:focus-visible { outline: none; }
  .screen:focus-visible:not(:fullscreen)::after { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: inherit; }
  /* Full screen keeps the picture's aspect: --fh is its height, the frame and the overlays follow it,
     and the overlay's shadow covers the rest of the frame, the player's footer included. */
  .screen:fullscreen { --fh: min(100vh, 100vw / var(--ar)); }
  .screen:fullscreen iframe { top: calc(50% - var(--fh) / 2); height: calc(var(--fh) + var(--chrome, 49px)); }
  .screen:fullscreen .ovl { margin: auto; width: calc(var(--fh) * var(--ar)); height: var(--fh); box-shadow: 0 0 0 100vmax #050607; }
  .ovl .box { position: absolute; border: 2px solid transparent; }
  .ovl .box.pgm { border-color: var(--pgm); } .ovl .box.pvw { border-color: var(--pvw); }
  .ovl .tag { position: absolute; display: flex; font: 10.5px/1.3 var(--mono); color: #e8edf2; background: rgb(0 0 0 / .62);
              padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  .ovl .tag b { flex: none; font-weight: inherit; margin-right: 1ch; }
  .ovl .tag i { flex: none; font-style: normal; color: var(--muted); margin-left: 5px; }
  .ovl p { position: absolute; inset: 45% 10px auto; margin: 0; text-align: center; color: var(--muted); font-size: 12.5px; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; min-height: 100%; }
    main { grid-template-columns: minmax(0, 1fr); }
    #scenes-card { min-height: 420px; max-height: 80vh; }   /* keeps the viewers within reach below */
    #wall { flex-wrap: wrap; }
    .viewer { width: 100% !important; max-width: 440px; }
    #stats { margin-left: 0; justify-content: flex-start; }
    .group { flex-wrap: wrap; row-gap: 4px; }
  }
  @media (max-width: 560px) { #buses, #row2 { grid-template-columns: minmax(0, 1fr); } #hint { display: none; } }
</style>

<header id="top">
  <h1>AVPlumber mixer</h1>
  <a class="link" href="/setup/">Setup</a>
  <a class="link" id="graph-link" target="_blank" rel="noopener" title="Opens the live graph view in a new tab">Graph view ↗</a>
  <span id="counts"></span>
  <span class="viewers-ctl"><span class="seg-label">Viewers</span>
    <span class="seg" id="viewer-count" role="group" aria-label="Number of viewers">
      <button type="button" data-n="1">1</button><button type="button" data-n="2">2</button>
    </span></span>
  <span id="conn" role="status" hidden></span>
  <span id="stats">
    <span class="meter" id="lat">LAT <b class="ms">—</b></span>
    <span class="group" id="gpu" role="group" aria-label="GPU" title="GPU load from nvidia-smi, refreshed every second" hidden></span>
  </span>
</header>

<main>
  <section id="deck" aria-label="Mixer controls">
    <div id="buses">
      <section class="card bus pgm"><h2 class="title">Program</h2><div class="scene" id="pgm">—</div><div class="state" id="pgm-state">on air</div></section>
      <section class="card bus pvw"><h2 class="title">Preview</h2><div class="scene" id="pvw">—</div><div class="state" id="pvw-state">ready</div></section>
    </div>

    <div id="row2" hidden>
      <section class="card widget" id="keys-card" aria-label="Downstream keys" hidden>
        <header><h2 class="title">Keys</h2><span class="note">dirty feed only</span>
          <span class="fade-ctl key-fade" id="key-fade"><label class="field" title="Key fade · empty or 0 cuts"><input id="key-fade-s" type="number" min="0" max="10" step="0.1" placeholder="0" aria-label="Key fade in seconds, empty or 0 cuts"><span>s</span></label></span></header>
        <div id="keys"></div>
      </section>
      <section class="card widget" id="slots-card" aria-label="Program preview scene slots" hidden>
        <header><h2 class="title">Program preview slots</h2><span class="note" id="slot-note"></span></header>
        <div id="slots"></div>
      </section>
    </div>

    <section class="card" id="scenes-card">
      <header>
        <span class="seg" role="group" aria-label="Deck view">
          <button type="button" id="tab-scenes" aria-pressed="true">Scenes</button><button type="button" id="tab-graph" aria-pressed="false">Signal flow</button>
        </span>
        <div id="chips" role="group" aria-label="Scene filter"></div>
        <a class="newtab" id="graph-open" target="_blank" rel="noopener" hidden>Open full graph in new tab
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2H2v8h8V7M7 2h3v3M10 2 5.5 6.5"/></svg></a>
      </header>
      <div id="scenes"></div>
      <div id="graph" hidden></div>
    </section>

    <footer class="card" id="takebar">
      <button class="btn" id="cut" type="button" title="Cut (C)" aria-keyshortcuts="C">Cut</button>
      <button class="btn" id="fade" type="button" title="Fade (F)" aria-keyshortcuts="F">Fade</button>
      <span class="fade-ctl" id="fade-ctl"><label class="field"><input id="fade-s" type="number" min="0.1" step="0.1" value="0.5" aria-label="Fade duration in seconds"><span>s</span></label></span>
      <span class="vsep"></span>
      <span id="wipes"></span>
      <label class="field" id="wipe-custom" hidden><input id="wipe-file" type="text" placeholder="wipe clip path on the mixer host" aria-label="Wipe clip path on the mixer host"></label>
      <span class="vsep"></span>
      <button class="btn" id="direct" type="button" aria-pressed="false" title="Picks take to program (D)" aria-keyshortcuts="D">Direct: off</button>
      <span id="hint" aria-hidden="true"><kbd>1–9</kbd><span class="w"> scene</span> · <kbd>C</kbd><span class="w"> cut</span> · <kbd>F</kbd><span class="w"> fade</span> · <kbd>W</kbd><span class="w"> wipe</span> · <kbd>D</kbd><span class="w"> direct</span><span id="hint-pages" hidden> · <kbd>[ ]</kbd> <kbd>R</kbd><span class="w"> pages</span></span></span>
      <div id="error" role="alert"></div>
    </footer>
  </section>

  <section id="wall" aria-label="Monitor wall"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem("avplumber.mixer." + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("avplumber.mixer." + k, JSON.stringify(v)); } catch (_) {} },
};
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
// Polling redraws every second; rebuilding unchanged DOM would drop focus and hover.
function changed(node, data) {
  const signature = JSON.stringify(data);
  if (node.dataset.signature === signature) return false;
  node.dataset.signature = signature;
  return true;
}
// A group rebuilt after its data changed, e.g. by the button just pressed, moves the keyboard focus
// to the new button with the same data-focus key.
function rebuild(node, children) {
  const key = node.contains(document.activeElement) ? document.activeElement.dataset.focus : undefined;
  node.replaceChildren(...children);
  if (key !== undefined) [...node.querySelectorAll("[data-focus]")].find((b) => b.dataset.focus === key)?.focus();
}
// A name whose end tells it apart; <bdi> keeps its own order inside the right-to-left box.
function tail(className, text) {
  const node = el("span", className ? `tail ${className}` : "tail"), inner = el("bdi", "", text);
  inner.dir = "ltr";
  node.append(inner);
  return node;
}

/* ---------- mixer state ---------- */
let state = null;                // last good /api/state
let stale = false;               // the last /api/state poll failed
let scenes = [];                 // [{id, name}], sorted like the tiles
let visible = [];                // scene ids behind the tiles, in the order 1–9 picks them
let selected = "";               // scene the take buttons act on
let direct = false;              // a pick goes straight to program
let directTouched = false;       // once the operator toggles it, stop following the config
let currentTransition = "cut";   // what a pick uses in direct mode; the config may change it
let tookTransition = false;      // once the operator takes one, stop following the config
// Stop polling from overwriting typing, or a curve the operator picked.
const touched = {fade: false, wipe: false, keyFade: false, fadeCurve: false, keyCurve: false};
let wipes = null;                // the library published by the mixer; null until the first state so an empty one still renders
let currentWipe = null;          // the clip W and a direct-mode wipe use
let armedSlot = null;            // multiview slot waiting for a scene
let setupRevision;
let filter = store.get("filter", "all"), tab = store.get("tab", "scenes");

const settings = () => state?.settings || {};
const auxBuses = () => state?.aux_buses || [];
const layoutOf = (aux) => aux.layout || "pgm_pvw_grid";   // older mixers only have the scene multiview
const isPages = (aux) => layoutOf(aux) === "source_pages";
const auxError = (aux) => aux.error || aux.composition_error;
const auxById = (id) => auxBuses().find((aux) => aux.id === id);
// Slot edits go to the scene multiview a viewer shows, else to the first one the mixer has.
const gridAux = () => auxById(viewers.find((v) => !v.el.hidden && v.grid)?.grid) ||
                      auxBuses().find((aux) => !isPages(aux)) || null;
const codecName = (codec) => ({h264: "H.264", h265: "H.265"})[codec] || String(codec || "").toUpperCase();
const canvasText = (c) => `${c.width}×${c.height}p${c.fps}`;
// Mixers from before the working_format option always composed in nv12.
const workingFormat = (c) => c?.working_format || "nv12";
const formatText = (c) => c ? `${canvasText(c)} ${({nv12: "SDR", p210le: "HDR 4:2:2"})[workingFormat(c)] || "HDR"}` : "";

async function api(path, body) {
  const response = await fetch(path, body === undefined ? undefined :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const reply = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(reply.error || `${response.status} ${response.statusText}`);
  return reply;
}
function showError(message) { $("error").textContent = message || ""; }
async function command(body, onSuccess) {
  try {
    showError("");
    await api("/api/command", body);
    onSuccess?.();
  } catch (exc) { showError(exc.message); }
  await refresh();
}

/* ---------- takes ---------- */
// A number field reads "" both when empty and when it holds no number; only empty means *empty*.
function fieldSeconds(id, empty, message) {
  if (!$(id).validity.badInput) return Number($(id).value) || empty;
  showError(message);
  return null;
}
function take(kind, scene = selected, wipe = currentWipe) {
  const payload = {command: kind, scene};
  if (kind === "fade") {
    payload.duration_sec = fieldSeconds("fade-s", 0.5, "Enter the fade length in seconds");
    if (payload.duration_sec === null) return;
    if (curves.fade.value !== "linear") payload.curve = curves.fade.value;   // linear: today's command
  }
  if (kind === "wipe") {
    payload.wipe_file = wipe ? wipe.path : $("wipe-file").value.trim();
    if (!payload.wipe_file) return showError("Enter a wipe clip path on the mixer host");
    if (wipe?.duration_seconds) payload.duration_sec = wipe.duration_seconds;
  }
  if (kind !== "preview") { currentTransition = kind; tookTransition = true; }
  if (kind === "wipe") currentWipe = wipe || currentWipe;
  return command(payload);
}
function pick(scene) {
  if (armedSlot !== null && gridAux()) return assignSlot(armedSlot, scene);
  selected = scene;
  return take(direct ? currentTransition : "preview", scene);
}
function setDirect(on) {
  direct = on;
  $("direct").setAttribute("aria-pressed", String(on));
  $("direct").textContent = `Direct: ${on ? "on" : "off"}`;
  renderBuses();
}
// One button per clip: during a live show a wipe must be one click away.
function renderWipes(library) {
  if (JSON.stringify(library) === JSON.stringify(wipes)) return;
  wipes = library;
  currentWipe = library.find((w) => w.id === currentWipe?.id) || library[0] || null;
  $("wipe-custom").hidden = library.length > 0;
  $("wipes").replaceChildren(...(library.length ? library : [null]).map((clip) => {
    const button = el("button", "btn wipe", library.length > 1 ? clip.name || clip.id : "Media wipe");
    if (clip) button.title = `${clip.path}${clip.duration_seconds ? ` · ${clip.duration_seconds} s` : ""}`;
    button.onclick = () => take("wipe", undefined, clip);
    return button;
  }));
}
function applySettings(s) {
  renderWipes(Array.isArray(s.wipes) ? s.wipes : []);
  if (typeof s.direct === "boolean" && !directTouched) setDirect(s.direct);
  if (s.fade_seconds && !touched.fade) $("fade-s").value = s.fade_seconds;
  if (s.fade_curve && !touched.fadeCurve) curves.fade.set(s.fade_curve);
  if (s.dsk_fade_seconds !== undefined && !touched.keyFade) $("key-fade-s").value = s.dsk_fade_seconds || "";
  if (s.dsk_fade_curve && !touched.keyCurve) curves.key.set(s.dsk_fade_curve);
  if (s.transition && !tookTransition) currentTransition = s.transition;
  if (s.wipe_file && !touched.wipe && !wipes.length) $("wipe-file").value = s.wipe_file;
}

/* ---------- deck ---------- */
function renderBuses() {
  const status = state?.status || {};
  $("pgm").textContent = status.pgm_scene || "—";
  $("pvw").textContent = status.pvw_scene || "—";
  const transition = status.transition || "idle";
  $("pgm-state").textContent = transition === "idle" ? "on air" : `on air · ${transition}`;
  $("pvw-state").textContent = direct ? `picks take to program with ${currentTransition}` : "ready";
}
function renderKeys() {
  const keys = state.dsk || [];
  $("keys-card").hidden = !keys.length;
  if (!changed($("keys"), keys)) return;
  rebuild($("keys"), keys.map((key) => {
    const name = key.id.replaceAll("_", " "), label = name[0].toUpperCase() + name.slice(1);
    const button = el("button", "key");
    button.append(el("span", "", label));
    button.dataset.focus = key.id;
    button.setAttribute("aria-pressed", String(key.on));
    button.title = `${label} · ${key.on ? "take off" : "put on"} air · dirty feeds only`;
    // An empty field cuts, even when the config fades by default.
    button.onclick = () => {
      const fade_seconds = fieldSeconds("key-fade-s", 0, "Enter the key fade in seconds, or leave it empty to cut");
      if (fade_seconds !== null) command({command: "dsk", key: key.id, on: !key.on, fade_seconds, curve: curves.key.value});
    };
    return button;
  }));
}
function renderSlots() {
  const aux = gridAux(), keys = Boolean(state?.dsk?.length);
  if (!aux) armedSlot = null;
  $("slots-card").hidden = !aux;
  $("row2").hidden = !aux && !keys;
  $("row2").classList.toggle("single", !aux || !keys);
  $("scenes").classList.toggle("armed", armedSlot !== null);
  if (!aux) return;
  const problem = auxError(aux) || (aux.suspended ? "suspended · assign a scene to resume" : "");
  $("slot-note").textContent = armedSlot !== null ? `pick a scene for M${armedSlot + 1}` : problem ||
    (aux.composition_pending ? "preparing sources · the program preview stays live" : "click a slot, then a scene · ⇧1–8");
  $("slot-note").classList.toggle("warn", armedSlot === null && Boolean(problem));
  if (!changed($("slots"), [aux.scenes, armedSlot])) return;
  rebuild($("slots"), aux.scenes.map((scene, i) => {
    const cell = el("div", "slot");
    const assign = el("button", "assign" + (scene ? "" : " empty"));
    assign.dataset.focus = `assign${i}`;
    assign.setAttribute("aria-pressed", String(armedSlot === i));
    assign.append(el("b", "", `M${i + 1}`), tail("", scene || "empty"));
    assign.title = scene ? `${scene} · click, then a scene to replace` : "Click, then a scene";
    assign.onclick = () => { armedSlot = armedSlot === i ? null : i; renderSlots(); };
    const clear = el("button", "clear", "×");
    clear.dataset.focus = `clear${i}`;
    clear.setAttribute("aria-label", `Clear M${i + 1}`);
    clear.onclick = () => assignSlot(i, null);
    cell.append(assign, clear);
    return cell;
  }));
}
function assignSlot(slot, scene) {
  const aux = gridAux();
  if (!aux) return;
  const assignments = [...aux.scenes];
  assignments[slot] = scene;
  // A stale expected_revision comes back as an error; the refresh then loads the current assignments.
  return command({command: "aux", bus: aux.id, expected_revision: aux.revision, scenes: assignments},
                 () => { armedSlot = null; });
}

// Tile order and filter chips follow the demo's scene families; anything else is "Other".
const GROUPS = [["random", "Random"], ["grid", "Grid"], ["fullscreen", "Fullscreen"], ["pip", "PiP"], ["other", "Other"], ["alpha_overlay", "Alpha"]];
const groupOf = (id) => id.match(/^(random|grid|fullscreen|pip|alpha_overlay)_/)?.[1] || "other";
const groupRank = (id) => GROUPS.findIndex(([g]) => g === groupOf(id));
function renderChips() {
  const counts = GROUPS.map(([g, name]) => [g, name, scenes.filter((s) => groupOf(s.id) === g).length]).filter(([, , n]) => n);
  if (!counts.some(([g]) => g === filter)) filter = "all";
  if (!changed($("chips"), [counts, filter])) return;
  rebuild($("chips"), (counts.length > 1 ? [["all", "All", scenes.length], ...counts] : []).map(([g, name, n]) => {
    const chip = el("button", "chip", name);
    chip.dataset.focus = g;
    chip.setAttribute("aria-pressed", String(filter === g));
    chip.append(el("span", "", String(n)));
    chip.onclick = () => { filter = g; store.set("filter", g); renderChips(); renderScenes(); };
    return chip;
  }));
}
function renderScenes() {
  const shown = scenes.filter((s) => filter === "all" || groupOf(s.id) === filter);
  visible = shown.map((s) => s.id);
  if (changed($("scenes"), shown)) {
    $("scenes").replaceChildren(...shown.map((scene, i) => {
      const tile = el("button", "tile");
      tile.dataset.scene = scene.id;
      tile.append(el("span", "n", i < 9 ? String(i + 1) : ""), el("span", "label", scene.name || scene.id));
      tile.onclick = () => pick(scene.id);
      return tile;
    }));
  }
  const {pgm_scene: pgm, pvw_scene: pvw} = state?.status || {};
  for (const tile of $("scenes").children) {
    tile.classList.toggle("pgm", tile.dataset.scene === pgm);
    tile.classList.toggle("pvw", tile.dataset.scene === pvw && pvw !== pgm);
  }
}
function setTab(next) {
  tab = next;
  store.set("tab", next);
  $("tab-scenes").setAttribute("aria-pressed", String(tab === "scenes"));
  $("tab-graph").setAttribute("aria-pressed", String(tab === "graph"));
  $("scenes").hidden = $("chips").hidden = tab !== "scenes";
  $("graph").hidden = $("graph-open").hidden = tab !== "graph";
  renderGraph();
}

/* ---------- signal flow ---------- */
const graphUrl = new URL("/", location.href);
graphUrl.port = "22222";
function graphHref(expand) {
  const url = new URL(graphUrl);
  if (expand) url.searchParams.set("expand", expand);
  return url.href;
}
$("graph-link").href = $("graph-open").href = graphHref();

const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}
// Stages, not nodes: the full graph has several nodes per source (hundreds at 100 sources), so the
// deck shows one box per stage with what the state reports, and each box opens that stage expanded.
function graphModel() {
  const s = settings(), status = state.status || {}, keys = state.dsk || [], mixer = state.mixer || "mixer";
  const outputs = s.preview_outputs || [], canvas = s.canvas ? canvasText(s.canvas) : "";
  const port = (o) => [o.port && `port ${o.port}`, o.fps && `p${o.fps}`].filter(Boolean).join(" · ");
  const encoders = [
    ...(s.preview_codecs || []).map((codec) => ({title: `${codecName(codec)} ${keys.length ? "dirty" : "program"}`,
                                                  sub: canvas, keyed: true})),
    ...outputs.filter((o) => !auxById(o.bus)).map((o) => ({title: `${codecName(o.codec)} clean`, sub: port(o), keyed: false})),
  ];
  const aux = auxBuses().map((a) => {
    const out = outputs.find((o) => o.bus === a.id);
    const sub = auxError(a) ? "error" : a.suspended ? "suspended"
      : isPages(a) ? `page ${a.page + 1}/${a.pages}${a.auto ? " · auto" : ""}`
      : `${a.scenes.filter(Boolean).length}/${a.scenes.length} slots${a.composition_pending ? " · pending" : ""}`;
    return {id: a.id, grid: !isPages(a), title: out?.label || a.id, sub,
            tip: auxError(a) || a.id, warn: Boolean(auxError(a) || a.suspended), hot: isPages(a) && Boolean(a.auto),
            encoder: out && {title: codecName(out.codec), sub: port(out)}};   // its row names the bus
  });
  return {
    sources: `${s.source_count ?? "—"} sources`, canvas, transition: status.transition || "idle",
    keys: keys.length ? `${keys.filter((k) => k.on).length} of ${keys.length} on` : null,
    me: [mixer, `${mixer}_a`, `${mixer}_b`, "mixer_preheat_router"].join(","),
    // The transition nodes live in the M/E's own group; the wipe chain and its clip loader have their own.
    transitionGroups: [mixer, `${mixer}_wipe`, `${mixer}_wipe_load`].join(","), encoders, aux, stale,
  };
}
function renderGraph() {
  if (tab !== "graph" || !state || $("graph").contains(document.activeElement)) return;
  const m = graphModel();
  if (!changed($("graph"), m)) return;
  const ROW = 48, H44 = 44;
  const encY = (i) => 8 + i * ROW;
  const programRows = Math.max(1, m.encoders.length);
  const chainY = 8 + (programRows * ROW - 4) / 2 - H44 / 2, cy = chainY + H44 / 2;
  const auxTop = encY(programRows) + 46;
  const auxY = (i) => auxTop + i * 80;
  const height = Math.max(100, (m.aux.length ? auxY(m.aux.length - 1) + H44 : Math.max(encY(programRows) - 4, chainY + H44)) + 26);
  const srcY = (height - 80) / 2, scy = srcY + 40;
  // Columns: sources, M/E and the multiviews, transition, keyer, encoders; 40 units between boxes.
  const SRC = [10, 120], ME = [170, 120], TR = [330, 110], KEY = [480, 110], ENC = [630, 140];
  const end = ([x, w]) => x + w, gap = (a, b) => (end(a) + b[0]) / 2;
  const keyerX = end(m.keys ? KEY : TR);      // where the keyed program leaves the chain
  const root = svg("svg", {viewBox: `0 0 ${end(ENC) + 10} ${height}`, preserveAspectRatio: "xMidYMid meet", role: "img",
    "aria-label": "Signal flow by stage: sources feed the M/E and the multiviews; the program passes the transition and the keyer to the encoders"});
  const edge = (d, dashed) => root.append(svg("path", {class: `edge${dashed ? " sub" : ""}`, d}));
  const node = (x, y, w, h, title, sub, expand, extra = {}) => {
    const g = svg("g", {class: `node${extra.hot ? " hot" : ""}${extra.warn ? " warn" : ""}${m.stale ? " stale" : ""}`, role: "link", tabindex: "0",
                        "aria-label": `Open ${title} expanded in the full graph`, "data-expand": expand});
    g.append(svg("rect", {x, y, width: w, height: h, rx: 7}));
    if (extra.tip) g.append(svg("title", {}, extra.tip));
    // Every stage shows its health: ok while /api/state is fresh, aux buses warn on error or suspension.
    g.append(svg("circle", {cx: x + w - 11, cy: y + 12, r: 4}));
    g.append(svg("text", {x: x + 10, y: y + 19}, title), svg("text", {class: "sub", x: x + 10, y: y + 35}, sub));
    root.append(g);
  };
  const toEncoder = (y) => `H${gap(KEY, ENC)} V${y + 22} H${ENC[0]}`;
  edge(`M${end(SRC)} ${scy} H${gap(SRC, ME)} V${cy} H${ME[0]}`);
  edge(`M${end(ME)} ${cy} H${TR[0]}`);
  if (m.keys) edge(`M${end(TR)} ${cy} H${KEY[0]}`);
  m.encoders.forEach((e, i) => edge(e.keyed || !m.keys ? `M${keyerX} ${cy} ${toEncoder(encY(i))}`
                                                       : `M${end(TR)} ${cy} H${gap(TR, KEY)} V${chainY + H44 + 26} ${toEncoder(encY(i))}`));
  // A scene multiview takes the program from where the keyer (or without keys, the transition) is.
  const tap = m.keys ? KEY : TR;
  m.aux.forEach((a, i) => {
    edge(`M${end(SRC)} ${scy} H${gap(SRC, ME)} V${auxY(i) + 22} H${ME[0]}`, true);
    if (a.grid) edge(`M${tap[0] + tap[1] / 2} ${chainY + H44} V${auxY(i) - 18} H${ME[0] + ME[1] / 2} V${auxY(i)}`, true);
    if (a.encoder) edge(`M${end(ME)} ${auxY(i) + 22} H${ENC[0]}`);
  });
  node(SRC[0], srcY, SRC[1], 80, "Sources", m.sources, "input_*");
  node(ME[0], chainY, ME[1], H44, "M/E", m.canvas, m.me);
  node(TR[0], chainY, TR[1], H44, "Transition", m.transition, m.transitionGroups, {hot: m.transition !== "idle"});
  if (m.keys) node(KEY[0], chainY, KEY[1], H44, "Keyer", m.keys, "output");
  m.encoders.forEach((e, i) => node(ENC[0], encY(i), ENC[1], H44, e.title, e.sub, "output"));
  m.aux.forEach((a, i) => {
    node(ME[0], auxY(i), ME[1], H44, a.title, a.sub, `aux_${a.id}`, {hot: a.hot, warn: a.warn, tip: a.tip});

function layoutWall() {
  const main = document.querySelector("main"), narrow = matchMedia("(max-width: 900px)").matches;
  const room = main.clientWidth - DECK_MIN - 14, options = outputOptions();
  const aspectOf = (v) => { const [w, h] = canvasSize(auxById(optionOf(v, options).value)); return w / h; };
  // The video gets what is left between the header and the stats row, inside the card's borders.
  const height = main.clientHeight - viewers[0].head.offsetHeight - viewers[0].statsRow.offsetHeight - 3;
  // A second viewer only when both keep a usable size; the choice is kept for a larger window.
  const fitsTwo = narrow || Math.min(height * aspectOf(viewers[0]), (room - 12) / 2) >= MIN_VIEWER;
  const two = $("viewer-count").children[1];
  two.disabled = !fitsTwo;
  two.title = fitsTwo ? "" : "Window too narrow for two viewers";
  for (const b of $("viewer-count").children) b.setAttribute("aria-pressed", String(Number(b.dataset.n) === viewers.length));
  viewers.forEach((v, i) => {
    v.el.hidden = i > 0 && !fitsTwo;
    v.close.hidden = viewers.length < 2;
    v.close.setAttribute("aria-label", `Close viewer ${i + 1}`);
    v.dd.setLabel(`Output of viewer ${i + 1}`);
    refreshViewer(v, options);
  });
  const shown = viewers.filter((v) => !v.el.hidden);
  if (narrow) shown.forEach((v) => (v.el.style.width = ""));
  else {
    const share = (room - (shown.length - 1) * 12) / shown.length;
    shown.forEach((v) => (v.el.style.width = `${Math.floor(Math.max(240, Math.min(height * aspectOf(v), share)))}px`));
  }
  shown.forEach(fitHeader);
  trimTakebar();   // the deck got its width
}
// The OUTPUT label shows whenever the header has room for it.
function fitHeader(v) {
  v.head.classList.remove("tight");
  const over = (n) => n && n.scrollWidth > n.clientWidth;   // the output name shrinks before the header overflows
  v.head.classList.toggle("tight", over(v.head) || over(v.head.querySelector(".dd-btn span")));
}
// A take bar separator is only shown between two controls on the same row, never at a row end, and
// the key hint, like the Keys card's note beside the key fade, only when it fits whole (the hint first
// drops its words).
function trimTakebar() {
  const hint = $("hint"), over = (n) => n.scrollWidth > n.clientWidth;
  hint.classList.remove("short");
  hint.classList.toggle("short", over(hint));
  for (const n of [hint, document.querySelector("#keys-card .note")]) n.style.visibility = over(n) ? "hidden" : "";
  const seps = [...document.querySelectorAll("#takebar .vsep")];
  seps.forEach((sep) => (sep.hidden = false));
  const sameRow = (a, b) => { const r = a.getBoundingClientRect(), q = b.getBoundingClientRect(); return q.top < r.bottom && q.bottom > r.top; };
  const shown = (node, step) => { while (node?.hidden || node?.offsetParent === null) node = node[step]; return node; };
  seps.forEach((sep) => (sep.hidden = ![shown(sep.previousElementSibling, "previousElementSibling"),
                                        shown(sep.nextElementSibling, "nextElementSibling")].every((n) => n && sameRow(sep, n))));
}
// main also shrinks when the top bar wraps, e.g. while the connection error shows.
new ResizeObserver(layoutWall).observe(document.querySelector("main"));
for (const b of $("viewer-count").children) b.onclick = () => {
  const n = Number(b.dataset.n);
  viewersTouched = true;
  while (viewers.length > n) viewers.pop().el.remove();
  if (viewers.length < n) addViewer(secondOutput().value);
  saveViewers();
  redraw();
};

/* ---------- stream stats ---------- */
// The screen clips the player's stats footer, so each player posts its numbers to this page about once
// per second, and its viewer shows them under the screen. The cut latency is the program encoder's, the
// same whichever player measured it, so the top bar shows it once for the pipeline.
const STREAM_STALE_MS = 3000;
const LAT_MEANING = "Latency: median of the last up to 3 measured CUTs: AVP command receipt to first matching encoded frame. " +
                    "Excludes earlier preview preparation. Not command ACK, frame age, or browser display latency.";
const STREAM_MEANING = {
  rtt: "RTT: WebRTC network round trip, not video latency. Green: ≤200 ms; orange: >200–400 ms; red: >400 ms.",
  fps: "FPS: frames this browser decoded per second during the latest sample (receiver side, not the mixer's output rate).",
  buf: "Buffer: average receiver jitter-buffer residence during the latest sample; not end-to-end latency.",
};
let cutLatency = null;           // the last stats that carried a measured cut latency
addEventListener("message", (e) => {
  const v = e.origin === playerBase.origin && viewers.find((x) => x.frame.contentWindow === e.source);
  if (!v || e.data?.type !== "avp-preview-stats") return;
  // The frame keeps its window across a source change, so a message the previous player posted just
  // before it navigated would otherwise be filed under the new output.
  if (!v.src || e.data.search !== new URL(v.src).search) return;
  v.stats = {data: e.data, at: performance.now()};
  // Only a measured latency replaces the top bar's, so a player without one does not blank it.
  if (Number.isFinite(e.data.latency?.ms)) cutLatency = v.stats;
  renderStream(v);
});
const fresh = (stats) => (stats && performance.now() - stats.at <= STREAM_STALE_MS ? stats.data : null);
function showStat(m, value, unit, coloured, title) {
  const n = Number.isFinite(value) ? Math.round(value) : null, b = m.lastElementChild;
  // From 1000 ms on, seconds ("1.2 s", "12 s") keep the value inside its reserved width.
  const [num, u] = n === null ? ["—", ""] : unit === "ms" && n >= 1000 ? [String(n < 9950 ? (n / 1000).toFixed(1) : Math.round(n / 1000)), "s"]
                                                                        : [String(n), unit];
  if (b.textContent !== num + u) b.replaceChildren(num, ...(u ? [el("span", "u", u)] : []));
  // Same thresholds as the player's latency and RTT colours.
  if (coloured) b.dataset.level = n === null ? "" : n <= 200 ? "good" : n <= 400 ? "warn" : "bad";
  m.title = title;
}
function renderStream(v) {
  const data = fresh(v.stats);
  const status = !data ? "No stats from its player in the last 3 s" : typeof data.status === "string" ? data.status : "";
  const title = (key) => [STREAM_MEANING[key], status].filter(Boolean).join("\n");
  showStat(v.meters.rtt, data?.rtt_ms, "ms", true, title("rtt"));
  showStat(v.meters.fps, data?.fps, "", false, title("fps"));
  showStat(v.meters.buf, data?.buffer_ms, "ms", false, title("buf"));
}
function renderLatency() {
  const lat = fresh(cutLatency)?.latency;
  showStat($("lat"), lat?.ms, "ms", true, [LAT_MEANING, typeof lat?.title === "string" && lat.title].filter(Boolean).join("\n"));
}

/* ---------- polling ---------- */
function render() {
  const s = settings(), status = state.status || {};
  scenes = s.scenes ? s.scenes.map((x) => ({id: x.id, name: x.name})) : (state.scenes || []).map((id) => ({id}));
  scenes.sort((a, b) => groupRank(a.id) - groupRank(b.id) || a.id.localeCompare(b.id, undefined, {numeric: true}));
  if (!selected || !scenes.some((scene) => scene.id === selected)) selected = status.pvw_scene || status.pgm_scene || "";
  applySettings(s);
  trackPages();
  layoutWall();   // first: the slots widget and the page keys follow what the viewers show
  renderCounts(); renderMeters(); renderBuses(); renderKeys(); renderSlots(); renderChips(); renderScenes();
  $("hint-pages").hidden = !pagesBus();
  $("hint").title = ["1–9 scene · C cut · F fade · W wipe · D direct", pagesBus() && "[ ] page · R rotate",
                     gridAux() && "⇧1–8 slot"].filter(Boolean).join(" · ");
  trimTakebar();
  renderGraph();
}
let polling = false, pollAgain = false;
async function refresh() {
  if (polling) { pollAgain = true; return; }
  polling = true;
  try {
    const next = await api("/api/state");
    if (next.setup_revision !== undefined) {
      if (setupRevision !== undefined && setupRevision !== next.setup_revision) {
        selected = ""; armedSlot = null;
        directTouched = tookTransition = false;
        for (const k in touched) touched[k] = false;
        viewers.forEach((v) => (v.src = null));   // reconnect every player to the new graph
      }
      setupRevision = next.setup_revision;
    }
    if (!state && !validSaved && !viewersTouched) {
      state = next;
      // With both monitors the first viewer shows the Program preview: its PGM tile keeps air in view.
      const grid = outputOptions().find((o) => o.layout === "pgm_pvw_grid");
      if (grid && outputOptions().some((o) => o.layout === "source_pages")) viewers[0].out = grid.value;
      const second = secondOutput();
      if (!second.program) addViewer(second.value);
      saveViewers();
    }
    state = next;
    $("conn").hidden = true;
    stale = false;
    render();
  } catch (exc) {
    $("conn").textContent = exc.message || String(exc);
    $("conn").hidden = false;
    stale = true;
    renderGraph();
  } finally {
    polling = false;
    if (pollAgain) { pollAgain = false; refresh(); }
  }
}

/* ---------- controls ---------- */
$("cut").onclick = () => take("cut");
$("fade").onclick = () => take("fade");
$("direct").onclick = () => { directTouched = true; setDirect(!direct); };
$("fade-s").oninput = () => { touched.fade = true; };
$("key-fade-s").oninput = () => { touched.keyFade = true; };
$("wipe-file").oninput = () => { touched.wipe = true; };
$("tab-scenes").onclick = () => setTab("scenes");
$("tab-graph").onclick = () => setTab("graph");

addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, .dd-menu") || e.metaKey || e.ctrlKey || e.altKey) return;
  const shifted = Number(e.code.replace("Digit", ""));
  if (e.shiftKey && gridAux() && shifted >= 1 && shifted <= 8) { e.preventDefault(); assignSlot(shifted - 1, selected || null); return; }
  const digit = Number(e.key);
  if (digit >= 1 && digit <= 9 && visible[digit - 1]) { e.preventDefault(); pick(visible[digit - 1]); return; }
  const k = e.key.toLowerCase(), bus = pagesBus();
  if (k === "c") take("cut");
  else if (k === "f") take("fade");
  else if (k === "w") take("wipe");
  else if (k === "d") $("direct").click();
  else if (bus && e.key === "[") pageCommand(bus, {step: -1});
  else if (bus && e.key === "]") pageCommand(bus, {step: 1});
  else if (bus && k === "r") pageCommand(bus, {auto: !auxById(bus).auto});
  else return;
  e.preventDefault();
});

(validSaved ? savedViewers : ["program"]).forEach(addViewer);
setTab(tab === "graph" ? "graph" : "scenes");
renderLatency();
refresh();
setInterval(refresh, 1000);
setInterval(() => { viewers.forEach(renderStream); renderLatency(); }, 1000);   // a player that stopped posting shows "—" after STREAM_STALE_MS
addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
