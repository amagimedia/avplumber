name: avplumber-mixer-demo

x-mixer-image: &mixer-image
  build:
    context: ../..
    # Fedora 44 / CUDA 13.4, which needs host driver R615 or newer. On an older driver
    # MIXER_DOCKERFILE=Dockerfile selects the Ubuntu 22.04 / CUDA 11.7 image (docs/guide.md).
    dockerfile: demos/mixer/${MIXER_DOCKERFILE:-Dockerfile.fedora44}
  image: avplumber-mixer:local

services:
  janus:
    extends: {file: ../dmabuf-browser/compose.yaml, service: janus}

  janus-preview:
    extends: {file: ../dmabuf-browser/compose.yaml, service: janus-preview}
    environment:
      MIXER_STATE_URL: http://127.0.0.1:${MIXER_HTTP_PORT:-7681}/api/state

  wayland:
    extends: {file: ../dmabuf-browser/compose.yaml, service: wayland}

  dma-browser:
    extends: {file: ../dmabuf-browser/compose.yaml, service: dma-browser}
    environment:
      DMA_BROWSER_AUTO_OPEN_URL: ""
      DMA_BROWSER_MAX_WINDOWS: ${MIXER_BROWSER_CAPACITY:-40}
      DMA_BROWSER_WINDOWS_PER_PROCESS: 8
      # Sources, then the window of each downstream-key graphic (v_avplumber.window in
      # graphics/<name>/<name>.ograf.json; tests/test_graphic_pages.py checks each is here):
      # keys export DMA-BUFs at the graphic's own size, not a transparent full frame.
      DMA_BROWSER_ALLOWED_DIMS: 1920x1080,1080x1920,1016x172,1920x80,152x152,304x152

  mixer:
    extends: {file: ../dmabuf-browser/compose.yaml, service: avplumber}
    <<: *mixer-image
    # webui.py restarts a mixer that exits on its own; this restarts webui.py itself.
    restart: unless-stopped
    # webui.py (PID 1) stops the mixer cleanly on SIGTERM so browser frames are released,
    # not quarantined: setup_runtime.STOP_TIMEOUT_SEC + 10 s reap + 20 s setup worker join.
    stop_grace_period: 90s
    # CUDA, DMA-BUF and graph queues need more than 1024 descriptors at 64 sources.
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    environment:
      # Opt-in: webui.py keeps the deadline-critical mixer threads at nice -N (0 = off).
      MIXER_CRITICAL_NICE: ${MIXER_CRITICAL_NICE:-0}
      # Optional public compute price JSON, for example /media/compute-price.json.
      MIXER_COMPUTE_PRICE: ${MIXER_COMPUTE_PRICE:-}
    entrypoint: [python3, demos/mixer/webui.py]
    volumes:
      - ../../media:/media:rw,z
    command:
      - --manage-setup
      # The measured demo host. Another machine needs its own profile in instance_profiles.py first.
      - --instance-type
      - ${MIXER_INSTANCE_TYPE:-tesla_t4}
      - --recipe
      - ${MIXER_RECIPE:-/media/demo.json}
      - --port
      - "${MIXER_CONTROL_PORT:-7777}"
      - --http-port
      - "${MIXER_HTTP_PORT:-7681}"
      - --dmabuf-rest
      - http://127.0.0.1:${DMA_BROWSER_REST_PORT:-9009}
      # The setup's extra aux outputs create their Janus mountpoints here.
      - --janus-api
      - http://127.0.0.1:${JANUS_HTTP_PORT:-8088}/janus
      # Behind a reverse proxy that serves the player under a path of the page's own origin: /preview/
      - --preview-base
      - ${MIXER_PREVIEW_BASE:-}
      - --mixer-args
      - --janus-output
      # Measures each cut's latency (mixer.status cut_latency), which the cut-spam gate reads.
      - --cut-latency-encoder
      - janus_encoder
      # The AVPlumber web UI (tools/web-ui) the mixer registers with: the players' cut-latency meter
      # reads mixer.status through its bridge (doc/mixer_cut_latency.md). Empty: no registration.
      - --webui-url
      - ${MIXER_WEBUI_URL:-}
      - --prewarm-cut-scene
      - '*'

volumes:
  wayland-runtime:
  dma-browser-sockets:
