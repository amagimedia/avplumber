<svg xmlns="http://www.w3.org/2000/svg" width="1348" height="591" viewBox="0 0 1348 591" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Decode once. Share references. Reuse safely.</title>
<desc id="fig-desc">Compressed video is decoded by NVDEC directly into a registered CUarray surface pool. The CUDA compositing engine takes references to that one decoded picture instead of copying it, samples its Y and UV planes as textures, and applies each layer’s crop, padding, rotation and scale as it writes separate 16:9 output canvases: Program with the full frame and a tilted picture-in-picture layer, an AUX close-up crop, and an AUX with a vertical crop padded into a pillarbox. NVENC encodes each canvas. Source references are released when GPU reads finish, so NVDEC can reuse the surface; NVENC releases each output canvas after encoding.</desc>
