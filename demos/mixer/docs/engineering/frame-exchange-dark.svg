<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="20" fill="#101a26"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="40" y="55" fill="#f5f8fc" font-weight="700" font-size="36">How a video frame travels</text><text x="42" y="107" fill="#72e4bc" font-weight="700" font-size="26">Same GPU · two containers</text><rect x="40" y="125" width="345" height="103" rx="12" fill="#1f3041" stroke="#72e4bc" stroke-width="2"/><text x="60" y="163" fill="#f5f8fc" font-weight="700" font-size="24">Mixer container</text><text x="60" y="198" fill="#b9cada" font-weight="400" font-size="22">cuda_ipc_sink</text><rect x="815" y="125" width="345" height="103" rx="12" fill="#1f3041" stroke="#72e4bc" stroke-width="2"/><text x="835" y="163" fill="#f5f8fc" font-weight="700" font-size="24">Consumer container</text><text x="835" y="198" fill="#b9cada" font-weight="400" font-size="22">cuda_ipc_source</text><path d="M385 178 H804 m-12 -8 l12 8 -12 8" fill="none" stroke="#72e4bc" stroke-width="3"/><text x="432" y="161" fill="#f5f8fc" font-weight="700" font-size="24">CUDA IPC handle</text><text x="432" y="212" fill="#b9cada" font-weight="400" font-size="20">One shared GPU allocation</text><text x="42" y="304" fill="#84caff" font-weight="700" font-size="26">Separate hosts · network link</text><rect x="40" y="322" width="345" height="103" rx="12" fill="#1f3041" stroke="#84caff" stroke-width="2"/><text x="60" y="360" fill="#f5f8fc" font-weight="700" font-size="24">Sending VM</text><text x="60" y="395" fill="#b9cada" font-weight="400" font-size="22">nvJPEG encode</text><rect x="815" y="322" width="345" height="103" rx="12" fill="#1f3041" stroke="#84caff" stroke-width="2"/><text x="835" y="360" fill="#f5f8fc" font-weight="700" font-size="24">Receiving VM</text><text x="835" y="395" fill="#b9cada" font-weight="400" font-size="22">GPU JPEG decode</text><path d="M385 375 H804 m-12 -8 l12 8 -12 8" fill="none" stroke="#84caff" s