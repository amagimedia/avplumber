services:
  dma-browser:
    environment:
      DMA_BROWSER_AUTO_OPEN_URL: ""
      DMA_BROWSER_MAX_WINDOWS: ${DMABUF_SOURCE_COUNT:-8}
      DMA_BROWSER_PROCESS_COUNT: ${DMABUF_BROWSER_PROCESS_COUNT:-}
      DMA_BROWSER_WINDOWS_PER_PROCESS: ${DMABUF_BROWSER_WINDOWS_PER_PROCESS:-8}
      DMA_BROWSER_ALLOWED_DIMS: ${DMA_BROWSER_ALLOWED_DIMS:-1920x1080,1280x720}
      DMA_BROWSER_DMABUF_POOL_SIZE: ${DMA_BROWSER_DMABUF_POOL_SIZE:-11}

  avplumber:
    environment:
      TEST_MODE: ${DMABUF_TEST_MODE:-grid}
      SOURCE_COUNT: ${DMABUF_SOURCE_COUNT:-8}
      COMPOSITOR_BACKEND: ${DMABUF_COMPOSITOR_BACKEND:-egl_cuda}
      SOURCE_URL: ${DMABUF_SOURCE_URL:-https://app.singular.live/output/6W76ei5ZNekKkYhe8nw5o8/Output?aspect=16:9}
      SOURCE_WIDTH: ${DMABUF_SOURCE_WIDTH:-1920}
      SOURCE_HEIGHT: ${DMABUF_SOURCE_HEIGHT:-1080}
      FPS: ${DMABUF_SOURCE_FPS:-60}
      CANVAS_WIDTH: ${DMABUF_CANVAS_WIDTH:-1920}
      CANVAS_HEIGHT: ${DMABUF_CANVAS_HEIGHT:-1080}
      DMA_BROWSER_REST_URL: http://127.0.0.1:9009
      BROWSER_REOPEN_DELAY_SEC: ${DMABUF_BROWSER_REOPEN_DELAY_SEC:-1}
      DMA_BROWSER_DMABUF_POOL_SIZE: ${DMA_BROWSER_DMABUF_POOL_SIZE:-11}
      SOCKET_DIR: /tmp/dma-page
      MPDECIMATE_INPUTS: ${DMABUF_MPDECIMATE_INPUTS:-0}
      MPDECIMATE_WIDTH: ${DMABUF_MPDECIMATE_WIDTH:-640}
      MPDECIMATE_HEIGHT: ${DMABUF_MPDECIMATE_HEIGHT:-360}
      TEST_DURATION_SEC: ${DMABUF_TEST_DURATION_SEC:-0}
      REPORT_INTERVAL_SEC: ${DMABUF_REPORT_INTERVAL_SEC:-10}
      GRAPH_START_TIMEOUT_SEC: ${DMABUF_GRAPH_START_TIMEOUT_SEC:-60}
      USE_DRM_HWACCEL: "0"
      VIDEO_BITRATE: ${DMABUF_VIDEO_BITRATE:-8000k}
    volumes:
      - ./graph:/opt/avplumber/dmabuf-browser-graph:ro
    command:
      [
        "python3",
        "/opt/avplumber/dmabuf-browser-graph/dmabuf_browser_scale_test.py",
      ]
