# Mixer demo with browser pages as sources.
#
# Overrides the base DMA-BUF stack: dma-browser opens nothing by itself, and the
# avplumber service runs demos/mixer/mixer.py (from this checkout, read-only)
# instead of the single-page graph. The mixer opens MIXER_SOURCE_COUNT windows
# named page_00.. through the REST API and takes them as --input dmabuf://page_NN.
#
#   docker compose --env-file .env -f compose.yaml -f compose.mixer.yaml up --build
#   python3 demos/mixer/tui.py --host 127.0.0.1 --port 7777 --fade-duration 0.8
services:
  dma-browser:
    environment:
      DMA_BROWSER_AUTO_OPEN_URL: ""
      DMA_BROWSER_MAX_WINDOWS: ${MIXER_SOURCE_COUNT:-4}
      DMA_BROWSER_WINDOWS_PER_PROCESS: ${DMABUF_BROWSER_WINDOWS_PER_PROCESS:-4}
      DMA_BROWSER_ALLOWED_DIMS: ${DMA_BROWSER_ALLOWED_DIMS:-1920x1080,1280x720},${MIXER_SOURCE_WIDTH:-1280}x${MIXER_SOURCE_HEIGHT:-720}
      DMA_BROWSER_DMABUF_POOL_SIZE: ${DMA_BROWSER_DMABUF_POOL_SIZE:-11}

  avplumber:
    environment:
      MIXER_SOURCE_COUNT: ${MIXER_SOURCE_COUNT:-4}
      MIXER_SOURCE_SIZE: ${MIXER_SOURCE_WIDTH:-1280}x${MIXER_SOURCE_HEIGHT:-720}
      MIXER_SOURCE_URL: ${HTML_OVERLAY_URL:-file:///opt/dma-browser/tests/fixtures/smoke.html}
      MIXER_FPS: ${HTML_OVERLAY_FPS:-60}
      MIXER_BITRATE_KBPS: ${DMABUF_VIDEO_BITRATE_KBPS:-8000}
    volumes:
      - dma-browser-sockets:/tmp/dma-page
      - ../../avpmixer:/opt/avplumber/avpmixer:ro,z
      - ../mixer:/opt/avplumber/demos/mixer:ro,z
    command:
      - sh
      - -c
      - |
        set -eu
        i=0
        while [ "$$i" -lt "$$MIXER_SOURCE_COUNT" ]; do
          set -- "$$@" --input "dmabuf://page_$$(printf %02d "$$i")"
          i=$$((i + 1))
        done
        exec python3 /opt/avplumber/demos/mixer/mixer.py "$$@" \
          --fps "$$MIXER_FPS" --janus-output --janus-host "$$JANUS_HOST" \
          --janus-video-port "$$JANUS_VIDEO_PORT" --janus-rtcp-port "$$JANUS_VIDEO_RTCP_PORT" \
          --janus-video-bitrate-kbps "$$MIXER_BITRATE_KBPS" --remote-control-port 7777 \
          --dmabuf-open "$$MIXER_SOURCE_URL" --dmabuf-size "$$MIXER_SOURCE_SIZE"
