<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVPlumber mixer</title>
<!-- webui.py fills in its options for the page, such as where the player is; the file holds the defaults. -->
<script id="config" type="application/json">{}</script>
<style>
  /* The mixer UI is deliberately dark-only. One control surface: a top strip with the show and its health; under it
     the deck at the left (Program and Preview, keys and slots, the transition panel, the scenes) and the outputs at
     the right. Every panel has one border; controls inside are filled surfaces, selection is a fill, state is a tally colour. */
  :root {
    color-scheme: dark;
    --bg: #0a0c0f; --panel: #13171c; --panel-hi: #171c22; --well: #0c0f13; --cap: #232b35; --cap-hi: #2d3744; --edge: #222a33; --groove: #1a2028;
    --text: #e8edf2; --muted: #8b98a5; --faint: #56616d;
    --pgm: #e5484d; --pgm-dim: #3a1416; --pvw: #30a46c; --pvw-dim: #0f2a1d; --led: #38d67f; --accent: #f5a524; --accent-dim: #2e230c; --wipe: #6e8bf5;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 13px; }
  /* Exactly the window's height while the window is wide: the scenes and the outputs end level at its bottom. */
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
  button { font: inherit; color: inherit; }
  button:focus-visible, .track:has(#lever:focus-visible), a:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  .lbl { font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  /* A shortcut where it acts, quiet enough to read past once it is learned. */
  kbd.k { font: 600 9.5px var(--mono); letter-spacing: 0; text-transform: none; color: var(--faint); background: var(--well);
          border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap; }
  button kbd.k { background: rgb(0 0 0 / .25); margin-left: 7px; }
  kbd.hint { font: 600 10px var(--mono); color: var(--faint); background: var(--well); border-radius: 4px; padding: 3px 6px; white-space: nowrap; }

  /* ---------- top strip ---------- */
  .top { display: flex; align-items: center; gap: 14px; padding-block: 7px; border-bottom: 1px solid var(--edge); background: var(--panel); flex-wrap: nowrap;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  /* One line: the counts give way first (their tip has them all), the meters keep their room. */
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 0; }
  .counts { position: relative; min-width: 0; display: flex; color: var(--muted); font-size: 12px; border-radius: 6px; padding: 3px 5px; outline: none; }
  .counts .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .counts:hover, .counts:focus-visible { background: var(--cap); }
  .counts:hover > .tip, .counts:focus-visible > .tip { display: block; left: 0; right: auto; }
  .brand h1 { margin: 0; font: 800 13px var(--ui); letter-spacing: .2em; text-transform: uppercase; }
  .meters { display: flex; gap: 8px; align-items: center; flex: none; }
  /* A long reason gives way like the counts; its title keeps all of it. */
  .conn { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); font-size: 12px; font-weight: 600; }
  .tools { display: flex; gap: 6px; align-items: center; flex: none; }
  .keyhint { position: relative; border-radius: 6px; padding: 5px 9px; background: var(--cap); color: var(--muted); font: 700 11px var(--mono); outline: none; cursor: default; }
  .keyhint:hover, .keyhint:focus-visible { color: var(--text); }
  .keyhint:hover > .tip, .keyhint:focus-visible > .tip { display: block; }
  .tip kbd { font: 600 11px var(--mono); color: var(--text); }
  /* A meter: its label and value over a bar, amber from 75% and red past 85%; a hover or the focus shows its tip. */
  .m { position: relative; display: grid; grid-template-columns: auto auto; column-gap: 7px; row-gap: 3px; align-items: center;
       border-radius: 6px; padding: 3px 5px; cursor: default; outline: none; }
  .m b { font: 700 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .m .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--groove); overflow: hidden; }
  .m .bar i { display: block; height: 100%; width: var(--p); background: var(--led); }
  .m .bar i.warn { background: var(--accent); }
  .m b.warn { color: var(--accent); } .m b.bad { color: var(--pgm); }
  .m .bar i.bad { background: var(--pgm); }
  .mgroup { display: flex; gap: 4px; }
  .m:hover, .m:focus-visible { background: var(--cap); }
  .m:hover > .tip, .m:focus-visible > .tip { display: block; }
  /* The pointer crosses the gap to a tip over this bridge, so the tip stays open to be read and scrolled. */
  .m:hover::after, .counts:hover::after, .keyhint:hover::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 8px; }
  /* A tip: a panel under its anchor with the figures behind it; Escape hides it until the pointer or the focus leaves. */
  .tip { display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; min-width: 280px; padding: 12px 14px 10px;
         background: var(--panel-hi); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 14px 34px rgb(0 0 0 / .65);
         font-family: var(--ui); text-align: left; max-height: calc(100vh - 70px); overflow-y: auto; }
  .tip.wide { min-width: 420px; }
  .tip h4 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; }
  .tip .about { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .tip .grp { display: flex; justify-content: space-between; margin: 10px 0 4px; font-size: 12.5px; }
  .tip .grp b { color: var(--accent); } .tip .grp span { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .tip .sub { margin: 10px 0 4px; font-size: 12px; font-weight: 600; }
  .tip .sub.plain { font-weight: 400; color: var(--muted); }
  .tip table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tip th { text-align: right; color: var(--faint); font-weight: 600; font-size: 10.5px; padding: 3px 0 3px 12px; }
  .tip th:first-child, .tip td:first-child { text-align: left; padding-left: 0; }
  .tip td { text-align: right; padding: 2px 0 2px 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
  .tip td:first-child { font-family: var(--ui); color: var(--muted); }
  .tip table + table { margin-top: 8px; }
  .links { display: flex; gap: 4px; }
  .links a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 12px; padding: 5px 9px; border-radius: 6px; background: var(--cap); }
  .links a:hover { color: var(--text); }

  /* ---------- shared controls ---------- */
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--well); box-shadow: inset 0 0 0 1px var(--edge); }
  .seg button { border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; padding: 6px 10px; min-width: 0;
                font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: linear-gradient(var(--cap-hi), var(--cap)); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .6); }
  .seg button:disabled { color: var(--faint); cursor: not-allowed; }
  .seg.small button { padding: 4px 9px; font-size: 11.5px; }
  /* A small square control; the padding and sizing a button gets from the browser are spelled out so a link looks the same. */
  .mini { border: 0; background: var(--cap); color: var(--muted); border-radius: 6px; width: 26px; height: 26px; cursor: pointer;
          padding: 1px 6px; box-sizing: border-box; }
  a.mini { text-decoration: none; text-align: center; align-content: center; }

  /* Styled dropdown: a button and a listbox of grouped options, each a name over its details; no native select. */
  .pick { position: relative; min-width: 0; }
  .picker { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 7px; background: var(--cap); padding: 5px 10px; font-weight: 600;
            cursor: pointer; min-width: 0; max-width: 100%; }
  .picker > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker svg { width: 10px; height: 10px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 280px; max-height: min(360px, var(--menu-room, 60vh)); overflow: auto;
          margin: 0; padding: 6px; list-style: none; overscroll-behavior: contain; scrollbar-width: thin;
          background: var(--panel-hi); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 14px 34px rgb(0 0 0 / .65); }
  .menu .grp { font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 8px 8px 4px; }
  .menu [role="option"] { display: grid; gap: 2px; border-radius: 7px; text-align: left; padding: 7px 8px; cursor: pointer; }
  .menu [role="option"]:hover, .menu [role="option"]:focus, .menu [aria-selected="true"] { background: var(--cap); outline: none; }
  .menu [aria-selected="true"] b { color: var(--accent); }
  .menu b { font-weight: 600; font-size: 12.5px; } .menu span { color: var(--faint); font-size: 11px; }
  /* A typed key rate's frame steps: two small arrows beside the value. */
  .stepper button { border: 0; background: none; color: var(--muted); font-size: 7px; line-height: 1; padding: 1px 2px; cursor: pointer; }
  .stepper button:hover { color: var(--text); }

  /* ---------- deck | divider | outputs ---------- */
  .main { display: grid; grid-template-columns: minmax(0, var(--deck, 930px)) 12px minmax(300px, 1fr); padding-block: 12px;
          padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-height: 0; }
  /* The dividers: drag or arrow keys set the deck's width (a double-click returns to the default) and the two
     outputs' share of the column; this browser keeps both. */
  .split { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .split::before { content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 2px; border-radius: 1px; background: transparent; }
  .split::after { content: ""; position: absolute; top: 50%; left: 3px; width: 6px; height: 36px; margin-top: -18px; border-radius: 3px;
                  background: radial-gradient(circle, var(--faint) 1.2px, transparent 1.6px) 0 0 / 6px 6px; }
  .split:hover::before, .split.drag::before, .split:focus-visible::before { background: var(--accent); }
  .vsplit { position: relative; height: 10px; margin-block: -5px; cursor: row-resize; touch-action: none; outline: none; flex: none; z-index: 1; }
  .vsplit::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; border-radius: 1px; background: transparent; }
  .vsplit::after { content: ""; position: absolute; left: 50%; top: 2px; width: 36px; height: 6px; margin-left: -18px; border-radius: 3px;
                   background: radial-gradient(circle, var(--faint) 1.2px, transparent 1.6px) 0 0 / 6px 6px; }
  .vsplit:hover::before, .vsplit.drag::before, .vsplit:focus-visible::before { background: var(--accent); }
  #scenes:focus-visible { outline: none; }
  .panel { background: linear-gradient(var(--panel-hi), var(--panel)); border: 1px solid var(--edge); border-radius: 12px; min-width: 0; }
  .panel > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; }
  .panel > header .note { color: var(--faint); font-size: 11px; }

  #deck { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
  #deck > :not(#scenes-card) { flex-shrink: 0; }
  /* Program and Preview */
  .buses { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bus { border-radius: 12px; padding: 11px 14px 12px; display: grid; gap: 4px; min-width: 0; border: 1px solid; }
  .bus.pgm { border-color: var(--pgm); background: linear-gradient(var(--pgm-dim), var(--panel) 75%); }
  .bus.pvw { border-color: var(--pvw); background: linear-gradient(var(--pvw-dim), var(--panel) 75%); }
  .bus .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 24px; }
  .bus .t { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .bus.pgm .t { color: var(--pgm); } .bus.pvw .t { color: var(--pvw); }
  .bus .name { font: 600 clamp(18px, 2vw, 25px) var(--mono); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bus .state { color: var(--muted); font-size: 12px; }
  /* FTB, Direct and All: small caps buttons; FTB and Direct red while on. */
  .chip { border: 0; border-radius: 6px; padding: 4px 9px; font: 700 10.5px var(--ui); letter-spacing: .1em; text-transform: uppercase; background: var(--cap); color: var(--muted); cursor: pointer; }
  .chip:hover { color: var(--text); }
  .chip.ftb[aria-pressed="true"], .chip.direct[aria-pressed="true"] { background: var(--pgm); color: #fff; }
  .chip.direct[aria-pressed="true"] kbd.k { color: rgb(255 255 255 / .8); }
  /* FTB flashes while black, as on a panel. */
  .chip.ftb.black { animation: ftb-flash 1s steps(2, jump-none) infinite; }
  @keyframes ftb-flash { 50% { background: var(--pgm-dim); color: var(--pgm); } }
  @media (prefers-reduced-motion: reduce) { .chip.ftb.black { animation: none; } }
  /* Next Transition, as on a GV panel: the layers the next Cut, Auto or lever take changes, lit while
     armed; a red dot marks a key on air now, which an armed take removes. The numbers are the keys' in the Keys card. */
  .next { display: flex; align-items: center; gap: 8px; }
  .next .seg button[aria-pressed="true"] { background: var(--accent); color: #1c1305; }
  .next .seg button.air::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--pgm); }

  /* Keys and slots */
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; }
  #row2.single { grid-template-columns: minmax(0, 1fr); }
  .keys, .slots { display: grid; gap: 6px; padding: 10px 12px 12px; }
  .keys { grid-template-columns: 1fr 1fr; }
  #row2.single .keys { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
  .slots { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #slot-note.warn { color: var(--accent); }
  /* A key: its take button and its rate tag in one box. A long name ends in an ellipsis, so the card keeps its height. */
  .key { display: flex; align-items: center; min-width: 0; border-radius: 8px; background: var(--cap); }
  .key .take { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; padding: 7px 4px 7px 9px; text-align: left; font-size: 13px; }
  .key .take span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The key's number: red while on air, amber while armed for the next transition. */
  .kn { display: inline-grid; place-items: center; min-width: 16px; height: 16px; border-radius: 4px; background: var(--well); font: 700 10px var(--mono); color: var(--muted); flex: none; }
  .key.on { background: linear-gradient(90deg, rgb(229 72 77 / .28), rgb(229 72 77 / .1)); box-shadow: inset 2px 0 0 var(--pgm); }
  .key.on .kn { background: var(--pgm); color: #fff; }
  .key.armed .kn { background: var(--accent); color: #1c1305; }
  /* A rate tag: a click steps its presets, the wheel a frame, F2 types it in place. */
  .rt { flex: none; margin-right: 6px; border: 0; border-radius: 4px; background: none; color: var(--faint); cursor: pointer; font: 600 10px var(--mono); padding: 2px 5px; }
  .rt:hover { background: var(--well); color: var(--text); }
  .rt:empty { display: none; }   /* a mixer without key rates */
  /* Every key at once: All takes them as K does; its rate tag is the rate of every key without its own. */
  .allkeys { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .allkeys .chip { padding: 3px 9px; }
  .allkeys .rt { margin-right: 0; background: var(--well); color: var(--text); }
  .rt.own { color: var(--text); }   /* a key's own rate; a faint tag follows All */
  .rt.edit { display: inline-flex; align-items: center; background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); cursor: auto; }
  .rt.edit input { width: 3em; border: 0; background: none; color: inherit; font: inherit; padding: 0; outline: none; }
  .slotc { display: flex; min-width: 0; border-radius: 8px; background: var(--cap); overflow: hidden; }
  .slotc .clear { flex: none; border: 0; background: none; color: var(--faint); cursor: pointer; padding: 0 8px; font-size: 14px; }
  .slotc .clear:hover { color: var(--text); background: var(--cap-hi); }
  .slot { flex: 1; display: grid; gap: 1px; min-width: 0; border: 0; background: none; padding: 6px 9px; text-align: left; cursor: pointer; }
  .slot b { font: 700 10px var(--mono); color: var(--faint); }
  .slot span { font: 500 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slotc:has(.armed) { background: var(--accent-dim); box-shadow: inset 0 0 0 1px var(--accent); }
  .slot.armed b { color: var(--accent); }

  /* Transition panel: Cut and Auto as big keys, the T-bar over the row of what Auto runs, its rate, curve and Auto again. */
  .tp { padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "take tbar side" "take ctrl ctrl"; gap: 9px 14px; container-type: inline-size; }
  /* The rate and curves sit level with the T-bar's track */
  .side { grid-area: side; display: flex; gap: 10px; align-items: center; align-self: end; }
  .takes { grid-area: take; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .key-big { width: 70px; border: 0; border-radius: 10px; cursor: pointer; display: grid; place-content: center; gap: 4px;
             font: 800 14px var(--ui); letter-spacing: .1em; text-transform: uppercase;
             background: linear-gradient(var(--cap-hi), var(--cap)); box-shadow: 0 3px 0 #07090b, inset 0 1px 0 rgb(255 255 255 / .07); }
  .key-big kbd { font: 500 10px var(--mono); letter-spacing: 0; text-transform: none; color: var(--faint); }
  .key-big:hover { background: linear-gradient(#36414f, #29323d); }
  .key-big:active { transform: translateY(2px); box-shadow: 0 1px 0 #07090b; }
  /* Cut flashes when pressed; Auto is red while its mix runs, amber while it is held. */
  .key-big.flash, .auto.run { background: linear-gradient(#f0595e, #c93439); }
  .key-big.flash kbd, .auto.run kbd { color: rgb(255 255 255 / .8); }
  .auto.held { background: linear-gradient(#3b2c0e, var(--accent-dim)); color: var(--accent); box-shadow: 0 3px 0 #07090b, inset 0 0 0 2px var(--accent); }
  /* The T-bar: the LEDs and the trail show the mix's progress from the end it started at, the grip where the lever is. */
  .tbar { grid-area: tbar; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "leds pct" "track track"; gap: 6px 12px; align-items: center; }
  /* Turning the panel: a small icon in its top right corner, over the room the rate and curves leave above them. */
  .tp { position: relative; }
  #tbar-turn { position: absolute; top: 5px; right: 6px; width: 18px; height: 18px; padding: 2px; display: grid; place-items: center; background: none; }
  #tbar-turn:hover { color: var(--text); background: var(--cap); }
  #tbar-turn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .leds { grid-area: leds; display: grid; grid-template-columns: repeat(40, 1fr); gap: 3px; height: 5px; }
  .leds i { border-radius: 2px; background: var(--groove); }
  .leds i.on { background: var(--led); box-shadow: 0 0 6px rgb(56 214 127 / .55); }
  .held-on .leds i.on, .held-on .trail { background: var(--accent); box-shadow: 0 0 6px rgb(245 165 36 / .5); }
  .pct { grid-area: pct; font: 700 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--faint); min-width: 4ch; text-align: right; }
  .pct.live { color: var(--text); }
  .track { grid-area: track; position: relative; height: 32px; border-radius: 10px; background: var(--well); touch-action: none; cursor: grab;
           box-shadow: inset 0 2px 10px rgb(0 0 0 / .7), inset 0 0 0 1px var(--edge); }
  .track:has(#lever:disabled) { opacity: .35; }   /* the keys alone are armed: the lever mixes the background only */
  .track::before { content: ""; position: absolute; left: 18px; right: 18px; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: #05070a; }
  .track::after { content: ""; position: absolute; left: 18px; right: 18px; top: 7px; bottom: 7px; background: repeating-linear-gradient(90deg, var(--groove) 0 1px, transparent 1px calc(10% - .1px)); }
  .trail { position: absolute; z-index: 1; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--led); box-shadow: 0 0 8px rgb(56 214 127 / .6);
           left: calc(18px + var(--a, 0) * (100% - 36px)); width: calc((var(--b, 0) - var(--a, 0)) * (100% - 36px)); pointer-events: none; }
  .grip { position: absolute; z-index: 2; top: -6px; bottom: -6px; width: 28px; left: calc(18px + var(--v, 0) * (100% - 36px)); transform: translateX(-50%); border-radius: 7px;
          background: linear-gradient(90deg, transparent 12px, var(--pgm) 12px 16px, transparent 16px), repeating-linear-gradient(0deg, rgb(0 0 0 / .14) 0 1px, transparent 1px 4px),
                      linear-gradient(90deg, #8e99a6, #e9edf1 45%, #f7f9fb 55%, #9aa5b2);
          box-shadow: 0 6px 14px rgb(0 0 0 / .75), inset 0 0 0 1px rgb(255 255 255 / .35); pointer-events: none; }
  /* The lever itself: a range input over the whole track, unseen. Its 36 px thumb puts the value's ends 18 px in,

<script src="/outputs.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$("setup-link").hidden = !config.setup;
const store = {
  get(k, d) { try { const v = localStorage.getItem("avplumber.mixer." + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("avplumber.mixer." + k, JSON.stringify(v)); } catch (_) {} },

}

function changed(node, data) {

}

function rebuild(node, children) {

  node.replaceChildren(...children);

}

/* ---------- mixer state ---------- */
let state = null;                // last good /api/state
let scenes = [];                 // [{id}], sorted like the tiles
let shownIds = [];               // scene ids the filter shows, on every page, in the order ← → walk them
let visible = [];                // scene ids on the page shown, in the order 1–9 picks them
let scenePage = 0;
let pageSize = 30;               // tiles the grid holds, from measure()
let selected = "";               // scene the take buttons act on
let direct = false;              // a pick goes straight to program
let directTouched = false;       // once the operator toggles it, stop following the config
let currentTransition = "cut";   // what a pick uses in direct mode; the config may change it
let tookTransition = false;      // once the operator takes one, stop following the config
// Stop polling from overwriting typing, or a curve the operator picked.
const touched = {fade: false, wipe: false, fadeCurve: false};
let wipes = null;                // the library published by the mixer; null until the first state so an empty one still renders
let currentWipe = null;          // the clip W and a direct-mode wipe use
let armedSlot = null;            // multiview slot waiting for a scene
let setupRevision;
let filter = store.get("filter", "all");

const settings = () => state?.settings || {};
const auxBuses = () => state?.aux_buses || [];
const isPages = (aux) => aux.layout?.preset === "source_pages";
const auxError = (aux) => aux.error || aux.composition_error;
const auxById = (id) => auxBuses().find((aux) => aux.id === id);
// A bus's cells of one role: "pvw", "pgm", "slot" (an assigned scene) or "source".
const cellsOf = (aux, role) => (aux?.cells || []).filter((cell) => cell.role === role);
const slotsOf = (aux) => cellsOf(aux, "slot").map((cell) => cell.slot).sort((a, b) => a - b);
// The slots card edits the viewer last clicked among those showing a bus with slots, else the first of them,
// else the first such bus.
let editViewer = null;
const showsSlots = (v) => v && viewers.includes(v) && !v.el.hidden && v.grid;
const gridViewer = () => (showsSlots(editViewer) ? editViewer : viewers.find(showsSlots)) || null;
const gridAux = () => auxById(gridViewer()?.grid) || auxBuses().find((aux) => slotsOf(aux).length) || null;
const LAYOUT_NAMES = {pgm_pvw_grid: "PVW · PGM grid", source_pages: "Source pages"};
function layoutName(spec) {
  if (spec.preset) return LAYOUT_NAMES[spec.preset] || spec.preset;
  const n = (role) => spec.cells.filter((cell) => cell.role === role).length;
  return ["Custom", n("pvw") && "PVW", n("pgm") && "PGM", n("slot") && `${n("slot")} slots`,
          n("source") && `${n("source")} sources`].filter(Boolean).join(" · ");
}
// Layouts the operator picks between: a preset whatever its page, or the same cells.
const sameLayout = (a, b) => JSON.stringify(a.preset ?? a.cells) === JSON.stringify(b.preset ?? b.cells);
const outputLabel = (bus) => settings().preview_outputs?.find((o) => o.bus === bus)?.label || bus;
const rateText = (o) => o.fps && `${o.fps} fps`;   // an output's encoded rate

// timing.at: when the reply's headers came, before its body.
async function api(path, body, timing = {}) {
  const response = await fetch(path, body === undefined ? undefined :
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  timing.at = performance.now();
  const reply = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(reply.error || `${response.status} ${response.statusText}`);
  return reply;
}
function showError(message) { $("error").textContent = message || ""; $("error").hidden = !message; }
async function command(body, onSuccess) {
  try {
    showError("");
    await api("/api/command", body);
    onSuccess?.();
  } catch (exc) { showError(exc.message); }
  await refresh();
}

/* ---------- takes ---------- */
// Rates as on a switcher panel: frames below a second ("15f"), seconds:frames from one second ("1:15").
// Commands still take seconds; seconds from the settings show as the nearest whole frame.
const fps = () => settings().canvas?.fps;
const FADE_SECONDS = 0.5;   // the fade an empty field runs
function formatRate(seconds) {
  const rate = fps(), frames = Math.round(seconds * rate);
  return frames < rate ? `${frames}f` : `${Math.floor(frames / rate)}:${String(frames % rate).padStart(2, "0")}`;
}
// Frames ("15", "15f") or seconds:frames with fewer frames than the rate ("1:15"): seconds, or null.
function parseRate(text) {
  const rate = fps(), m = text.trim().toLowerCase().match(/^(?:(\d+):(\d{1,2})|(\d+)f?)$/);
  if (!m || !rate || Number(m[2]) >= rate) return null;
  return m[3] !== undefined ? Number(m[3]) / rate : Number(m[1]) + Number(m[2]) / rate;
}
// An empty field, or 0, reads as *empty*.
function fieldRate(id, empty, message) {
  const text = $(id).value.trim(), seconds = text ? parseRate(text) : empty;
  if (seconds === null) showError(message);
  return seconds === null ? null : seconds || empty;
}
const fadeSeconds = () => fieldRate("fade-s", FADE_SECONDS, "Enter the fade rate in frames (15) or seconds:frames (1:15)");
// A wheel notch or swipe steps a rate a frame, a second with Shift (which many systems turn into a sideways scroll);
// a trackpad's many small deltas add up to half a notch first. Up is longer, the way the hand moves: with natural
// scrolling (macOS's default, and what Safari reports) an upward swipe arrives as a positive delta, with a classic
// wheel as a negative one.
const naturalScroll = (e) => e.webkitDirectionInvertedFromDevice ?? /Mac/.test(navigator.platform);
function wheelSteps(target, apply) {
  let acc = 0;
  target.addEventListener("wheel", (e) => {
    e.preventDefault();
    const d = (e.deltaY || e.deltaX) * (e.deltaMode ? 40 : 1);   // lines (some Firefox wheels) or pixels
    acc += naturalScroll(e) ? d : -d;
    if (Math.abs(acc) < 50) return;
    apply((acc > 0 ? 1 : -1) * (e.shiftKey ? fps() : 1));
    acc = 0;
  }, {passive: false});
}
// Without a scene, a take acts on the Preview the mixer shows, as Space does: after a take the
// preview is the scene that left program, not the one picked last.
// The status names a mix "crossfade" or "wipe" only; Program's state names this page's own take ("dip", a
// wipe's name) until that mix ends.
let tookAs = null;
// A mix this page has drawn to its end while the last poll still shows it on air: the mixer has ended it, and its
// Preview is the scene that left program (Program's in that poll). A take of that kind waiting for air is a new one.
const endedHere = () => mix?.ended > 0 && mix.drawn >= 1 && takeMix(state?.status) === mix.kind && state.status.transition_on_air;
// The scene this page's last Auto mixes to: Auto again during that mix halts it only with that scene (cut.cpp), and a
// poll's Preview may still be an older one.
let takeScene = null;
function take(kind, scene = (endedHere() ? state.status.pgm_scene : state?.status?.pvw_scene) || selected, wipe = currentWipe) {
  const payload = {command: kind, scene};
  if (kind === "fade" || kind === "wipe") takeScene = scene;
  if (kind === "fade") {
    payload.duration_sec = fadeSeconds();
    if (payload.duration_sec === null) return;
    if (curves.fade.value !== "linear") payload.curve = curves.fade.value;   // linear: today's command
    if (fadeColor.hex()) payload.color = fadeColor.hex();                  // mix: no colour
  }
  if (kind === "wipe") {
    payload.wipe_file = wipe ? wipe.path : $("wipe-file").value.trim();
    if (!payload.wipe_file) return showError("Enter a wipe clip path on the mixer host");
    if (wipe?.duration_seconds) payload.duration_sec = wipe.duration_seconds;
  }
  const took = kind === "fade" ? {transition: "crossfade", name: payload.color ? "dip" : "fade"}
    : kind === "wipe" ? {transition: "wipe", name: (wipe?.name || "wipe").toLowerCase()} : null;
  const halted = pressTake(kind), pressedAt = takePressedAt;
  // A press made since is the T-bar's: this acceptance no longer starts or runs on a mix.
  return command(payload, () => { if (took) tookAs = took; if (pressedAt === takePressedAt) acceptTake(kind, payload, halted); })
    .then(() => { if (pressedAt === takePressedAt) takeAcceptedAt = Math.max(takeAcceptedAt, pressedAt); });   // a take the mixer refused is not waited for
}
// Next Transition: BKGD is this page's choice; the armed keys are the keyer's (prepare_inputs), shared by
// every controller. With BKGD the engine carries the armed keys on the background take's own clock.
let nextBkgd = true;
const armedKeys = () => (state?.dsk || []).filter((key) => key.next_take).map((key) => key.id);
// Auto pressed again during its own mix: Halt is the mixer's own second press (it holds the mix, once more runs it
// on); Complete finishes the mix at once, as Cut does.
const AUTO_AGAIN = [...$("auto-ctl").querySelectorAll("button")];
let autoAgainMode = AUTO_AGAIN.some((b) => b.dataset.value === store.get("autoAgain")) ? store.get("autoAgain") : "halt";
const renderAutoAgain = () => AUTO_AGAIN.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === autoAgainMode)));
for (const b of AUTO_AGAIN) b.onclick = () => { store.set("autoAgain", autoAgainMode = b.dataset.value); renderAutoAgain(); };
renderAutoAgain();
function takeButton(kind) {
  if (kind === "cut") {   // the key lights as pressed, also when C pressed it
    $("cut").classList.add("flash");
    setTimeout(() => $("cut").classList.remove("flash"), 160);
  }
  if (!nextBkgd) return takeKeys(kind);
  const s = state?.status || {};
  // Cut also completes a wipe on air; Halt holds a wipe of the clip cache as it holds a mix.
  // Running: this page's model of it (from the press on, and over by its end), else as the poll shows it.
  const running = mixOn() || (!!takeMix(s) && !endedHere());
  if (kind !== "cut" && autoAgainMode === "complete" && running) return take("cut", mixOn() && takeScene || undefined);
  return take(kind, mixOn() && takeScene || undefined);
}
// Keys alone: Cut cuts the armed keys, Auto fades them at the Fade rate; each turns to its opposite.
function takeKeys(kind) {
  const keys = armedKeys();
  if (!keys.length) return showError("Arm BKGD or a key for the take");
  const fade_seconds = kind === "cut" ? 0 : fadeSeconds();
  if (fade_seconds === null) return;
  return command({command: "dsk", keys, toggle: true, fade_seconds, curve: curves.fade.value});
}
function pick(scene) {
  if (armedSlot !== null && gridAux()) return assignSlot(armedSlot, scene);
  selected = scene;
  return take(direct ? "cut" : "preview", scene);
}
// As on a vision switcher, choosing the transition only prepares Auto; Cut and Auto take.
function selectTransition(kind, clip) {
  currentTransition = kind;
  tookTransition = true;
  if (clip) currentWipe = clip;
  renderTransition();
  renderNext();
  // W too: the list scrolls sideways to the chosen wipe, the page stays where it is.
  const list = $("wipes"), chosen = kind === "wipe" && list.querySelector('[aria-pressed="true"]');
  if (chosen) {
    const l = list.getBoundingClientRect(), b = chosen.getBoundingClientRect();
    list.scrollBy({left: b.left < l.left ? b.left - l.left : Math.max(0, b.right - l.right)});
  }
  restFocus();
}
// W selects the wipe chosen last; while a wipe is selected, the next one round the list.
function selectWipe() {
  const at = currentTransition === "wipe" && wipes?.length ? wipes.indexOf(currentWipe) : -1;
  selectTransition("wipe", at < 0 ? undefined : wipes[(at + 1) % wipes.length]);
}
// What Auto runs, with a fade's rate: "fade 15f", "dip 1:15", a wipe's name or "cut".
function autoLabel() {
  const rate = currentTransition === "fade" && parseRate($("fade-s").value);
  return `${transitionLabel()}${rate ? ` ${formatRate(rate)}` : ""}`;
}
function transitionLabel() {
  if (currentTransition === "fade") return fadeColor.hex() ? "dip" : "fade";
  if (currentTransition === "wipe") return currentWipe?.name || "wipe";
  return "cut";
}
function renderTransition() {
  $("fade").setAttribute("aria-pressed", String(currentTransition === "fade" && !fadeColor.hex()));
  $("dip").setAttribute("aria-pressed", String(currentTransition === "fade" && !!fadeColor.hex()));
  for (const button of $("wipes").children)
    button.setAttribute("aria-pressed", String(currentTransition === "wipe" && button.dataset.clip === (currentWipe?.id ?? "")));
  // As wide as its rate, as the panel's readout: "10:00" needs a fifth character.
  $("fade-s").style.width = `${Math.max(4.4, $("fade-s").value.length)}ch`;
  const rate = parseRate($("fade-s").value);
  for (const button of $("fade-presets").children) button.setAttribute("aria-pressed", String(rate !== null && rate === parseRate(button.dataset.rate)));
  renderBuses();
}
// ← → walk every scene the filter shows, ↑ ↓ a row of the grid, wrapping, and turn to the page that holds the new Preview.
function stepPreview(step) {
  if (!shownIds.length) return;
  const at = shownIds.indexOf(selected);
  selected = shownIds[at < 0 ? (step > 0 ? 0 : shownIds.length - 1) : (at + step + shownIds.length) % shownIds.length];
  scenePage = Math.floor(shownIds.indexOf(selected) / pageSize);
  renderScenes();
  return take("preview", selected);
}
function setDirect(on) {
  direct = on;
  $("direct").setAttribute("aria-pressed", String(on));
  renderBuses();
}
// One button per clip: during a live show a wipe must be one click away. More than fit scroll sideways.
function renderWipes(library) {
  if (JSON.stringify(library) === JSON.stringify(wipes)) return;
  wipes = library;
  currentWipe = library.find((w) => w.id === currentWipe?.id) || library[0] || null;
  $("wipe-custom").hidden = library.length > 0;
  $("wipes").replaceChildren(...(library.length ? library : [null]).map((clip) => {
    const button = el("button", "wipe", clip ? clip.name || clip.id : "Media wipe");
    button.type = "button";
    if (clip) button.title = `Select for Auto: ${clip.path}${clip.duration_seconds ? ` · ${clip.duration_seconds} s` : ""}`;
    button.dataset.clip = clip ? clip.id : "";
    button.setAttribute("aria-pressed", "false");
    button.onclick = () => selectTransition("wipe", clip);
    return button;
  }));
}
// The list has no scroll bar, so a plain wheel scrolls it sideways as well, not only Shift+wheel or a sideways swipe.
$("wipes").addEventListener("wheel", (e) => {
  const list = $("wipes"), d = e.deltaY || e.deltaX;
  if (d < 0 ? list.scrollLeft <= 0 : list.scrollLeft + list.clientWidth >= list.scrollWidth - 1) return;
  e.preventDefault();
  list.scrollLeft += d * (e.deltaMode ? 40 : 1);
}, {passive: false});
function applySettings(s) {
  renderWipes(Array.isArray(s.wipes) ? s.wipes : []);
  if (typeof s.direct === "boolean" && !directTouched) setDirect(s.direct);
  if (fps() && !touched.fade) $("fade-s").value = formatRate(s.fade_seconds || FADE_SECONDS);
  if (s.fade_curve && !touched.fadeCurve) curves.fade.set(s.fade_curve);
  if (store.get("fadeColor", null) === null) fadeColor.seed(s.fade_color || null);
  if (s.transition && !tookTransition) currentTransition = s.transition;
  if (s.wipe_file && !touched.wipe && !wipes.length) $("wipe-file").value = s.wipe_file;
  renderTransition();
}

/* ---------- deck ---------- */
function showName(node, name) { if (node.textContent !== name) node.textContent = name; }
function renderBuses() {
  const status = state?.status || {};
  showName($("pgm"), status.pgm_scene || "—");
  showName($("pvw"), status.pvw_scene || "—");
  $("pvw-state").textContent = direct ? "picks cut to program" : `Auto · ${nextBkgd ? autoLabel() : "keys"}`;
  renderLever();
}
/* The T-bar's motion. The page draws it, while it moves, on every animation frame from one model; the polls (once a
   second, a few times a second while a mix runs or a take waits for air), late by a varying network delay, only
   correct the model, so the T-bar neither steps back nor jumps.
   - A poll is dated by the mixer's clock (status.now_pts_ms): the least arrival (of the reply's headers, before its
     long body) − now_pts_ms seen maps that clock onto this page's with the least delay. A reply no newer than the one
     shown (the bridge's cache) is no news, and one taken before this page's last press says nothing about that take.
     One asked before the mixer accepted it can have been taken before the mixer had it: it counts only if it shows a
     mix running and the press runs one (an Auto, not a Halt or Cut).
   - A mix (Auto, a wipe) is a start and a duration. A sample, taken back through the take's curve to the time it
     stands for, puts the start no earlier than the true one, so the earliest so far is the estimate; the progress
     at t is the curve at (t − start) / duration. This page's Auto starts it when the mixer accepts it, Halt freezes
     it at the press and the next Auto runs it on; Cut, an idle sample and the end of the mix end it.
   - The T-bar is drawn by a start of its own that goes toward the estimate at a bounded rate (mixDrawn): a sample
     that moves the start earlier makes it gain on the mix, never jump, and it never steps back. A hold stops it at
     once where it is drawn; the mixer's hold, a poll later, is at or past it and the T-bar goes up to it.
   - The lever runs a twin of the mixer's Lever (src/mixer/primitives/Lever.hpp) on the positions this page sends, so
     its origin and progress are known at once; a sample whose lever position is this page's last one corrects it. */
// [time to progress, progress to time] for the presets of src/mixer/primitives/fade_curve.hpp
const CURVE_AT = {linear: [(x) => x, (p) => p], "ease-in": [(x) => x * x, Math.sqrt],
  "ease-out": [(x) => x * (2 - x), (p) => 1 - Math.sqrt(1 - p)],
  "ease-in-out": [(x) => x * x * (3 - 2 * x), (p) => 0.5 - Math.sin(Math.asin(1 - 2 * p) / 3)]};
// A take's shape: a fade's progress is its curve's value (TakeClock::progress), a dip's and a wipe's the linear time
// progress. A dip's picture (fade_curve.hpp dipCurveExpression) runs the curve once per half around a hold of one
// frame at the colour, so the T-bar draws that; a wipe draws linear.
const takeShape = (kind, {curve, color} = {curve: curves.fade.value, color: fadeColor.hex()}) =>
  ({curve: kind === "crossfade" ? curve || "linear" : "linear", dip: kind === "crossfade" && !!color});
const frameMs = () => 1000 / (fps() || 30);
const GRIP_BACK_MS = 250;   // the grip's way back to the lever once a mix ends
const CATCH_UP = 1.5;       // a T-bar behind the mixer's mix gains on it at most this many times the mix's own speed
const CATCH_UP_MS = 200;    // and closes the gap by its share of this each ms, so it slows into place
// How much later than this page's guess (its acceptance + a frame) the mixer's mixes start, learnt per kind from each

const DIPS = {black: "#000000", white: "#ffffff"};

  let choice = store.get("fadeColor", "mix"), custom = store.get("fadeCustom", "#000000");
  if (choice !== "custom" && !DIPS[choice]) choice = "mix";
  let dip = store.get("fadeDip", choice === "mix" ? "black" : choice);   // the colour Dip goes through

  field.dispatchEvent(new Event("input"));
}
// Without step buttons of its own, the field gets two small arrows after it.
function rateField(field, steps) {
  if (!steps) {
    const stepper = el("span", "stepper");
    steps = [["▲", 1, "One frame longer"], ["▼", -1, "One frame shorter"]].map(([glyph, step, label]) => {
      const button = el("button", "", glyph);
      button.type = "button";
      button.dataset.step = step;
      button.title = label;
      button.setAttribute("aria-label", label);
      return button;
    });
    stepper.append(...steps);
    field.after(stepper);
  }
  for (const button of steps) {
    button.tabIndex = -1;
    button.onmousedown = (e) => e.preventDefault();   // the focus stays put, so Space after a click is still Auto
    button.onclick = (e) => stepRate(field, Number(button.dataset.step) * (e.shiftKey ? fps() : 1));
  }
  field.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    stepRate(field, e.key === "ArrowUp" ? 1 : -1);
  });
  wheelSteps(field.parentElement, (n) => stepRate(field, n));
  field.addEventListener("change", () => { const seconds = parseRate(field.value); if (seconds) field.value = formatRate(seconds); });
}
rateField($("fade-s"), [...$("fade-ctl").querySelectorAll(".step")]);
$("fade-s").addEventListener("change", renderTransition);   // after rateField's reformat: "300" becomes "10:00"
for (const button of $("fade-presets").children) {
  button.tabIndex = -1;
  button.onmousedown = (e) => e.preventDefault();   // the focus stays put, so Space after a click is still Auto
  button.onclick = () => {
    if (!fps()) return;
    $("fade-s").value = formatRate(parseRate(button.dataset.rate));
    $("fade-s").dispatchEvent(new Event("input"));
  };
}
$("wipe-file").oninput = () => { touched.wipe = true; };

// The keyboard focus rests on the scene grid, so 1–9 and Shift+1–9 work without a click first. A field
// keeps the digits typed into it and gives the focus back on Enter or Escape.
function restFocus() { $("scenes").focus({preventScroll: true}); }
for (const field of document.querySelectorAll("#deck input"))
  field.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === "Escape") restFocus(); });
// The shortcuts work wherever the focus is, a focused button included (Space is Auto, never a press of it), except
// while typing in a field or choosing in an open menu. A focused lever keeps its arrow keys.
addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey ||
      e.target.closest?.('input:not([type="range"]), textarea, select, [contenteditable]:not([contenteditable="false"]), .menu') ||
      (e.target.type === "range" && /^(Arrow|Home|End|Page)/.test(e.key))) return;
  if (e.repeat && (e.key === " " || e.key.toLowerCase() === "k")) { e.preventDefault(); return; }
  const shifted = Number(e.code.replace("Digit", ""));
  if (e.shiftKey && shifted >= 1 && shifted <= slotsOf(gridAux()).length) { e.preventDefault(); assignSlot(shifted - 1, selected || null); return; }
  const digit = Number(e.key);
  if (digit >= 1 && digit <= 9 && visible[digit - 1]) { e.preventDefault(); pick(visible[digit - 1]); return; }
  const k = e.key.toLowerCase(), bus = pagesBus();
  // The scene pages: < and >, or the keys they share without Shift (, and .), wherever the layout puts them.
  const flip = {"<": -1, ",": -1, ">": 1, ".": 1}[e.key] ?? {Comma: -1, Period: 1}[e.code];
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") stepPreview(e.key === "ArrowLeft" ? -1 : 1);
  else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();   // not a scroll of the page
    const columns = getComputedStyle($("scenes")).gridTemplateColumns.split(" ").length;
    stepPreview(e.key === "ArrowUp" ? -columns : columns);
  }
  else if (e.key === " ") takeButton(currentTransition);
  else if (k === "k") toggleAllKeys();
  else if (k === "c") takeButton("cut");
  else if (k === "f") selectFade();
  else if (k === "w") selectWipe();
  else if (k === "d" && e.shiftKey) $("direct").click();   // Shift, not the letter's case: D with Caps Lock still dips
  else if (k === "d") selectDip();
  else if (flip) flipPage(flip);
  else if (bus && e.key === "[") pageCommand(bus, {step: -1});
  else if (bus && e.key === "]") pageCommand(bus, {step: 1});
  else return;
  e.preventDefault();
});

(validSaved ? savedViewers : ["program"]).forEach(addViewer);
pageSize = measure();
// On any resize: the page size, and whether the page buttons still fit beside the filters (renderScenes redraws only what changed).
new ResizeObserver(() => { pageSize = measure(); renderScenes(); }).observe($("scenes"));
restFocus();
renderLatency(); renderHint();
refresh();
setInterval(refresh, 1000);
setInterval(() => { viewers.forEach(renderStream); renderLatency(); }, 1000);   // a player that stopped posting shows "—" after STREAM_STALE_MS
addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
