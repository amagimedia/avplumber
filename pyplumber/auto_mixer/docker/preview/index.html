<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>avplumber Janus Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #181c22;
      --line: #303742;
      --text: #eef2f6;
      --muted: #9ba7b4;
      --danger: #e35d5d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100vh;
    }

    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      border-color: var(--line);
      background: var(--panel);
      color: var(--muted);
    }

    .stage {
      display: grid;
      min-height: 0;
      background: #050607;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 45px);
      object-fit: contain;
      background: #050607;
    }

    #status {
      min-height: 20px;
    }

    .error {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main>
    <section class="stage">
      <video id="preview" autoplay playsinline controls muted></video>
    </section>

    <footer>
      <span id="status">Idle</span>
    </footer>
  </main>

  <script>
    const MOUNTPOINT_ID = 1;
    const serverUrl = `${location.origin}/janus`;
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");

    let sessionId = null;
    let handleId = null;
    let peer = null;
    let pollAbort = null;
    let keepaliveTimer = null;
    let retryTimer = null;
    let transactionId = 0;
    let connecting = false;
    let stopping = false;

    function transaction() {
      transactionId += 1;
      return `avp-${Date.now()}-${transactionId}`;
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    async function post(path, body) {
      const response = await fetch(`${serverUrl.replace(/\/$/, "")}${path}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ transaction: transaction(), ...body }),
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function createSession() {
      const response = await post("", { janus: "create" });
      sessionId = response.data.id;
      keepaliveTimer = window.setInterval(() => {
        if (sessionId) {
          post(`/${sessionId}`, { janus: "keepalive" }).catch(() => {});
        }
      }, 25000);
    }

    async function attachStreamingPlugin() {
      const response = await post(`/${sessionId}`, {
        janus: "attach",
        plugin: "janus.plugin.streaming",
      });
      handleId = response.data.id;
    }

    async function sendTrickle(candidate) {
      if (!sessionId || !handleId) return;
      const body = candidate ? { candidate } : { candidate: { completed: true } };
      await post(`/${sessionId}/${handleId}`, { janus: "trickle", ...body });
    }

    async function startPeerConnection(offer) {
      peer = new RTCPeerConnection({ iceServers: [] });
      peer.ontrack = event => {
        const [stream] = event.streams;
        if (preview.srcObject !== stream) {
          preview.srcObject = stream;
        }
        preview.play().catch(error => {
          if (error.name !== "AbortError") {
            setStatus(error.message, true);
          }
        });
      };
      peer.onicecandidate = event => {
        sendTrickle(event.candidate).catch(error => setStatus(error.message, true));
      };
      peer.onconnectionstatechange = () => setStatus(`WebRTC ${peer.connectionState}`);
      await peer.setRemoteDescription(offer);
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      await post(`/${sessionId}/${handleId}`, {
        janus: "message",
        body: { request: "start" },
        jsep: peer.localDescription,
      });
    }

    async function handleEvent(event) {
      if (event.janus === "event" && event.jsep) {
        await startPeerConnection(event.jsep);
      } else if (event.janus === "trickle" && peer) {
        await peer.addIceCandidate(event.candidate);
      } else if (event.janus === "webrtcup") {
        setStatus("WebRTC connected");
      } else if (event.janus === "hangup") {
        setStatus(event.reason || "WebRTC hung up", true);
      } else if (event.janus === "error") {
        throw new Error(event.error?.reason || "Janus error");
      }
    }

    async function pollEvents() {
      pollAbort = new AbortController();
      while (!stopping && sessionId) {
        const rid = Date.now();
        const url = `${serverUrl.replace(/\/$/, "")}/${sessionId}?rid=${rid}&maxev=1`;
        const response = await fetch(url, { signal: pollAbort.signal });
        if (!response.ok) {
          throw new Error(`Poll HTTP ${response.status}`);
        }
        const event = await response.json();
        if (Array.isArray(event)) {
          for (const item of event) await handleEvent(item);
        } else {
          await handleEvent(event);
        }
      }
    }

    function scheduleReconnect(message) {
      window.clearTimeout(retryTimer);
      setStatus(`${message}; retrying`, true);
      retryTimer = window.setTimeout(connect, 2000);
    }

    async function recover(error) {
      if (stopping) return;
      const message = error?.message || "Connection failed";
      await disconnect(false);
      scheduleReconnect(message);
    }

    async function connect() {
      if (sessionId || connecting) return;
      connecting = true;
      stopping = false;
      try {
        setStatus("Creating Janus session");
        await createSession();
        pollEvents().catch(error => {
          recover(error);
        });
        setStatus("Attaching streaming plugin");
        await attachStreamingPlugin();
        setStatus("Requesting stream");
        await post(`/${sessionId}/${handleId}`, {
          janus: "message",
          body: { request: "watch", id: MOUNTPOINT_ID },
        });
      } catch (error) {
        await recover(error);
      } finally {
        connecting = false;
      }
    }

    async function disconnect(showIdle = true) {
      stopping = true;
      if (pollAbort) pollAbort.abort();
      window.clearInterval(keepaliveTimer);
      keepaliveTimer = null;
      if (peer) {
        peer.close();
        peer = null;
      }
      preview.srcObject = null;
      try {
        if (sessionId) await post(`/${sessionId}`, { janus: "destroy" });
      } catch (_) {
      } finally {
        sessionId = null;
        handleId = null;
        if (showIdle) setStatus("Idle");
      }
    }

    function start() {
      setStatus("Auto connecting");
      connect();
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
      start();
    }

    window.addEventListener("beforeunload", () => {
      stopping = true;
      window.clearTimeout(retryTimer);
      if (pollAbort) pollAbort.abort();
      if (peer) peer.close();
    });
  </script>
</body>
</html>
