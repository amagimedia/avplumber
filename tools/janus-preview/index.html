<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>avplumber Janus Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #181c22;
      --line: #303742;
      --text: #eef2f6;
      --muted: #9ba7b4;
      --accent: #2fb47c;
      --danger: #e35d5d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-color: var(--line);
      background: var(--panel);
    }

    header {
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
    }

    h1 {
      margin: 0 12px 0 0;
      font-size: 16px;
      font-weight: 650;
    }

    label {
      display: grid;
      gap: 4px;
      min-width: 180px;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      min-width: 0;
      height: 34px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0c0e12;
      color: var(--text);
      font: inherit;
    }

    #serverUrl {
      width: min(420px, 60vw);
    }

    #mountpointId {
      width: 110px;
    }

    button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #232a33;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: #27875f;
      background: var(--accent);
      color: #06100b;
      font-weight: 650;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .stage {
      display: grid;
      min-height: 0;
      background: #050607;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 118px);
      object-fit: contain;
      background: #050607;
    }

    #status {
      min-height: 20px;
    }

    .error {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>avplumber Janus Preview</h1>
      <label>
        Janus API
        <input id="serverUrl" autocomplete="off">
      </label>
      <label>
        Mountpoint
        <input id="mountpointId" type="number" min="1" value="1">
      </label>
      <button id="connectButton" class="primary">Connect</button>
      <button id="disconnectButton" disabled>Disconnect</button>
    </header>

    <section class="stage">
      <video id="preview" autoplay playsinline controls></video>
    </section>

    <footer>
      <span id="status">Idle</span>
    </footer>
  </main>

  <script>
    const serverUrl = document.getElementById("serverUrl");
    const mountpointId = document.getElementById("mountpointId");
    const connectButton = document.getElementById("connectButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");

    let sessionId = null;
    let handleId = null;
    let peer = null;
    let pollAbort = null;
    let keepaliveTimer = null;
    let transactionId = 0;
    let stopping = false;

    serverUrl.value = `${location.protocol}//${location.hostname}:8088/janus`;

    function transaction() {
      transactionId += 1;
      return `avp-${Date.now()}-${transactionId}`;
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "error" : "";
    }

    async function post(path, body) {
      const response = await fetch(`${serverUrl.value.replace(/\/$/, "")}${path}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ transaction: transaction(), ...body }),
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.json();
    }

    async function createSession() {
      const response = await post("", { janus: "create" });
      sessionId = response.data.id;
      keepaliveTimer = window.setInterval(() => {
        if (sessionId) {
          post(`/${sessionId}`, { janus: "keepalive" }).catch(() => {});
        }
      }, 25000);
    }

    async function attachStreamingPlugin() {
      const response = await post(`/${sessionId}`, {
        janus: "attach",
        plugin: "janus.plugin.streaming",
      });
      handleId = response.data.id;
    }

    async function sendTrickle(candidate) {
      if (!sessionId || !handleId) return;
      const body = candidate ? { candidate } : { candidate: { completed: true } };
      await post(`/${sessionId}/${handleId}`, { janus: "trickle", ...body });
    }

    async function startPeerConnection(offer) {
      peer = new RTCPeerConnection({ iceServers: [] });
      peer.ontrack = event => {
        preview.srcObject = event.streams[0];
        preview.play().catch(error => setStatus(error.message, true));
      };
      peer.onicecandidate = event => {
        sendTrickle(event.candidate).catch(error => setStatus(error.message, true));
      };
      peer.onconnectionstatechange = () => setStatus(`WebRTC ${peer.connectionState}`);
      await peer.setRemoteDescription(offer);
      const answer = await peer.createAnswer();
      await peer.setLocalDescription(answer);
      await post(`/${sessionId}/${handleId}`, {
        janus: "message",
        body: { request: "start" },
        jsep: peer.localDescription,
      });
    }

    async function handleEvent(event) {
      if (event.janus === "event" && event.jsep) {
        await startPeerConnection(event.jsep);
      } else if (event.janus === "trickle" && peer) {
        await peer.addIceCandidate(event.candidate);
      } else if (event.janus === "webrtcup") {
        setStatus("WebRTC connected");
      } else if (event.janus === "hangup") {
        setStatus(event.reason || "WebRTC hung up", true);
      } else if (event.janus === "error") {
        throw new Error(event.error?.reason || "Janus error");
      }
    }

    async function pollEvents() {
      pollAbort = new AbortController();
      while (!stopping && sessionId) {
        const rid = Date.now();
        const url = `${serverUrl.value.replace(/\/$/, "")}/${sessionId}?rid=${rid}&maxev=1`;
        const response = await fetch(url, { signal: pollAbort.signal });
        if (!response.ok) {
          throw new Error(`Poll HTTP ${response.status}`);
        }
        const event = await response.json();
        if (Array.isArray(event)) {
          for (const item of event) await handleEvent(item);
        } else {
          await handleEvent(event);
        }
      }
    }

    async function connect() {
      connectButton.disabled = true;
      disconnectButton.disabled = false;
      stopping = false;
      try {
        setStatus("Creating Janus session");
        await createSession();
        pollEvents().catch(error => {
          if (!stopping) setStatus(error.message, true);
        });
        setStatus("Attaching streaming plugin");
        await attachStreamingPlugin();
        setStatus("Requesting stream");
        await post(`/${sessionId}/${handleId}`, {
          janus: "message",
          body: { request: "watch", id: Number(mountpointId.value) },
        });
      } catch (error) {
        setStatus(error.message, true);
        await disconnect();
      }
    }

    async function disconnect() {
      stopping = true;
      connectButton.disabled = false;
      disconnectButton.disabled = true;
      if (pollAbort) pollAbort.abort();
      window.clearInterval(keepaliveTimer);
      keepaliveTimer = null;
      if (peer) {
        peer.close();
        peer = null;
      }
      preview.srcObject = null;
      try {
        if (sessionId) await post(`/${sessionId}`, { janus: "destroy" });
      } catch (_) {
      } finally {
        sessionId = null;
        handleId = null;
        setStatus("Idle");
      }
    }

    connectButton.addEventListener("click", connect);
    disconnectButton.addEventListener("click", disconnect);
    window.addEventListener("beforeunload", () => {
      stopping = true;
      if (pollAbort) pollAbort.abort();
      if (peer) peer.close();
    });
  </script>
</body>
</html>
